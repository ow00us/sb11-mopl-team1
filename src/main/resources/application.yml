spring:
  application:
    name: mopl
  profiles:
    active: dev
  batch:
    job:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    postgresql:
      # V4 의 CREATE INDEX CONCURRENTLY 는 트랜잭션 밖 실행이 필요.
      # Flyway 는 기본적으로 transactional advisory lock 을 사용하는데, 이 락이 트랜잭션 안에서
      # 획득되므로 CONCURRENTLY 와 충돌해 hang 이 발생한다. false 로 두면 session-level
      # advisory lock 을 사용해 트랜잭션 밖 실행과 공존할 수 있다.
      transactional-lock: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
    version: OPENAPI_3_1
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true

jwt:
  issuer: mopl
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:30m}

tmdb:
  base-url: https://api.themoviedb.org/3
  access-token: ${TMDB_ACCESS_TOKEN}
  image-base-url: https://image.tmdb.org/t/p/w500

sportsdb:
  base-url: https://www.thesportsdb.com/api/v1/json
  api-key: ${SPORTSDB_API_KEY}
  league-ids: 4569,4328,4335,4331,4332,4334

external-content-batch:
  tmdb-max-pages: 5
  sportsdb-past-days: 3
  sportsdb-future-days: 3
  cron: "0 0 4 * * *"

app:
  cors:
    # 콤마로 구분한 브라우저 REST API 허용 origin 목록
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  websocket:
    # 콤마로 구분하면 String[]으로 자동 바인딩
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:5173}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/mopl
    username: mopl
    password: mopl
    hikari:
      # REQUIRES_NEW로 부모+자식 트랜잭션이 커넥션 2개를 점유할 수 있어 상한을 명시. 부하 튜닝은 별도 인프라 이슈.
      maximum-pool-size: 20
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    baseline-on-migrate: true

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    properties:
      hibernate:
        format_sql: false

app:
  cors:
    # prod는 기본값 없이 강제 - 실제 프론트 배포 origin을 명시해야 함
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  websocket:
    # prod는 기본값 없이 강제 - 값이 누락되면 애플리케이션 시작 시점에 실패
    allowed-origins: ${WS_ALLOWED_ORIGINS}
