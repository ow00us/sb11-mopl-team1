spring:
  application:
    name: mopl
  mail:
    # 로컬에서는 MailHog 또는 Mailpit SMTP 포트인 1025를 기본값으로 사용
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

    # 인증이 필요한 운영 SMTP에서는 환경변수로 주입
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

    properties:
      mail:
        smtp:
          # 로컬 SMTP 서버는 인증 없이 사용할 수 있도록 false를 기본값으로 설정
          auth: ${MAIL_SMTP_AUTH:false}

          starttls:
            # 운영 SMTP 정책에 따라 환경변수로 활성화
            enable: ${MAIL_STARTTLS_ENABLE:false}

          # SMTP 서버 장애가 요청 스레드를 장시간 점유하지 않도록 제한
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_READ_TIMEOUT:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:5000}
  profiles:
    active: dev
  batch:
    job:
      enabled: false
  task:
    scheduling:
      pool:
        size: 2
  data:
    redis:
      timeout: 2s
      connect-timeout: 1s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # offset 은 소비 결과가 성공한 뒤 컨테이너가 커밋합니다. 자동 커밋을 쓰면
      # 처리 실패한 레코드의 offset 까지 넘어갑니다.
      enable-auto-commit: false
      # auto-offset-reset 은 프로파일별로 다릅니다. 아래 dev·prod 블록을 참고하세요.
  flyway:
    postgresql:
      # V4 의 CREATE INDEX CONCURRENTLY 는 트랜잭션 밖 실행이 필요.
      # Flyway 는 기본적으로 transactional advisory lock 을 사용하는데, 이 락이 트랜잭션 안에서
      # 획득되므로 CONCURRENTLY 와 충돌해 hang 이 발생한다. false 로 두면 session-level
      # advisory lock 을 사용해 트랜잭션 밖 실행과 공존할 수 있다.
      transactional-lock: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
    version: OPENAPI_3_1
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true

jwt:
  issuer: mopl
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3h}

refresh-token:
  expiration: ${REFRESH_TOKEN_EXPIRATION:7d}
  cookie:
    # 기존 OpenAPI의 토큰 재발급 Cookie 계약과 동일한 이름
    name: REFRESH_TOKEN

    # 인증 API에만 Refresh Token Cookie를 전송
    path: /api/auth

    # 서로 다른 사이트 배포 시 None으로 변경하고 Secure=true와 함께 사용
    same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}

    # 로컬 HTTP 개발 환경에서는 false
    secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}

password-reset:
  mail:
    # 임시 비밀번호 안내 메일에 표시할 발신 주소
    from-address: ${PASSWORD_RESET_MAIL_FROM:no-reply@mopl.local}

    # 메일 제목은 환경별로 변경할 수 있지만 줄바꿈 문자는 허용하지 않음
    subject: ${PASSWORD_RESET_MAIL_SUBJECT:[모두의 플리] 임시 비밀번호 안내}

watching-session:
  presence-ttl: ${WATCHING_SESSION_PRESENCE_TTL:90s}
  # TODO: FE heartbeat 배포 이후에 session-ttl 시간 단축
  session-ttl: ${WATCHING_SESSION_SESSION_TTL:30m}
  heartbeat-interval: ${WATCHING_SESSION_HEARTBEAT_INTERVAL:20s}

tmdb:
  base-url: https://api.themoviedb.org/3
  access-token: ${TMDB_ACCESS_TOKEN}
  image-base-url: https://image.tmdb.org/t/p/w500

sportsdb:
  base-url: https://www.thesportsdb.com/api/v1/json
  api-key: ${SPORTSDB_API_KEY}
  league-ids: 4569,4328,4335,4331,4332,4334

external-content-batch:
  tmdb-max-pages: 5
  sportsdb-past-days: 3
  sportsdb-future-days: 3
  cron: "0 0 4 * * *"
  zone: Asia/Seoul

mopl:
  kafka:
    topic:
      # 공통 토픽과 DLT 를 기동 시 선언적으로 생성할지 여부입니다.
      auto-create: ${KAFKA_TOPIC_AUTO_CREATE:true}
      # 토픽을 만들지 않는 환경에서 필요한 토픽이 있는지 기동 시 확인할지 여부입니다.
      # 브로커 없이 개발할 때 기동이 실패하지 않도록 기본값은 false 입니다.
      verify: ${KAFKA_TOPIC_VERIFY:false}
    listener:
      # 로컬에 Kafka 를 띄우지 않고 개발할 때 false 로 두면 연결 경고가 반복되지 않습니다.
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:true}
  outbox:
    # 선점 유효 기간입니다. 짧으면 발행이 끝나기 전에 다른 인스턴스가 회수해 중복 발행이
    # 늘고, 길면 relay 가 죽었을 때 회수가 그만큼 지연됩니다.
    lease-duration: ${OUTBOX_LEASE_DURATION:30s}

app:
  cors:
    # 콤마로 구분한 브라우저 REST API 허용 origin 목록
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  websocket:
    # 콤마로 구분하면 String[]으로 자동 바인딩
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:5173}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/mopl
    username: mopl
    password: mopl
    hikari:
      # REQUIRES_NEW로 부모+자식 트랜잭션이 커넥션 2개를 점유할 수 있어 상한을 명시. 부하 튜닝은 별도 인프라 이슈.
      maximum-pool-size: 20
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    consumer:
      # 로컬에서는 브로커를 다시 띄우거나 그룹을 바꿔도 쌓인 이벤트를 처음부터 볼 수
      # 있어야 디버깅이 됩니다.
      auto-offset-reset: earliest

---
spring:
  config:
    activate:
      on-profile: prod
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
  jpa:
    properties:
      hibernate:
        format_sql: false
  kafka:
    # prod는 기본값 없이 강제 - 값이 누락되면 애플리케이션 시작 시점에 실패
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      # 새 Consumer Group 이 붙을 때 토픽에 남은 과거 이벤트를 전부 재소비하면
      # 오래된 알림이 한꺼번에 생성됩니다. 과거 이벤트 재처리는 의도적인 replay 로만
      # 수행하고, 평시에는 신규 이벤트만 받습니다.
      auto-offset-reset: latest

mopl:
  kafka:
    topic:
      # 운영 토픽은 미리 준비합니다. 파티션 수 결정이 코드 배포에 묶이지 않게 합니다.
      auto-create: false
      # verify 는 기본값 false 를 그대로 씁니다. true 로 두면 기동 시 AdminClient 로
      # 브로커에 접속하므로 애플리케이션 기동이 Kafka 가용성에 묶입니다. 지금은 도메인
      # 리스너가 없어 그 결합을 만들 이유가 없고, 결합 여부는 운영에서 결정할 사안입니다.
      # 브로커가 보장되는 환경에서 KAFKA_TOPIC_VERIFY=true 로 켭니다.

app:
  cors:
    # prod는 기본값 없이 강제 - 실제 프론트 배포 origin을 명시해야 함
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  websocket:
    # prod는 기본값 없이 강제 - 값이 누락되면 애플리케이션 시작 시점에 실패
    allowed-origins: ${WS_ALLOWED_ORIGINS}

refresh-token:
  cookie:
    # 운영 환경에서는 별도 설정이 없어도 HTTPS 전용 Cookie를 기본으로 사용
    secure: ${REFRESH_TOKEN_COOKIE_SECURE:true}


---
spring:
  config:
    activate:
      # 시연·QA용 초기 데이터가 필요한 경우에만 추가로 활성화
      on-profile: seed

seed:
  admin:
    # 실제 관리자 정보는 Git에 기록하지 않고 실행 환경에서 주입
    name: ${SEED_ADMIN_NAME}
    email: ${SEED_ADMIN_EMAIL}
    password: ${SEED_ADMIN_PASSWORD}
