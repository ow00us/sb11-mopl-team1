spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: true
  flyway:
    enabled: true
  batch:
    job:
      enabled: false
  kafka:
    consumer:
      # 테스트는 컨테이너를 새로 띄우므로 처음부터 읽어야 합니다.
      auto-offset-reset: earliest

mopl:
  kafka:
    # Kafka 를 쓰지 않는 대다수 테스트가 broker 연결을 시도하지 않도록 기본값을 끕니다.
    # Kafka 통합 테스트가 자기 클래스에서만 다시 켭니다.
    topic:
      auto-create: false
    listener:
      auto-startup: false
  outbox:
    # lease 만료 회수를 기다리지 않고 검증하기 위해 짧게 둡니다.
    lease-duration: 2s
    relay:
      # 스케줄 실행이 테스트 데이터를 먼저 가져가면 검증이 흔들립니다. relay 통합
      # 테스트는 컴포넌트를 직접 만들어 호출합니다.
      enabled: false
    retry:
      # 최대 횟수 초과를 몇 번의 호출로 검증할 수 있게 낮춥니다.
      max-attempts: 3
      initial-backoff: 1s
      max-backoff: 4s
      multiplier: 2.0
    cleanup:
      # 주기 실행이 테스트 데이터를 먼저 지우면 검증이 흔들립니다. 정리 통합 테스트는
      # 컴포넌트를 직접 만들어 호출합니다.
      enabled: false
      retention: 7d
      batch-size: 1000
    metrics:
      # 갱신 시점을 테스트가 정할 수 있어야 gauge 값을 확정적으로 확인할 수 있습니다.
      enabled: false

  realtime:
    relay:
      # Redis 를 띄우지 않는 대다수 테스트가 구독 재연결을 반복하지 않도록 끕니다.
      # 중계 통합 테스트가 자기 클래스에서만 다시 켭니다.
      enabled: false

