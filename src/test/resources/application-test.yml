spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: true
  flyway:
    enabled: true
  batch:
    job:
      enabled: false

mopl:
  kafka:
    # Kafka 를 쓰지 않는 대다수 테스트가 broker 연결을 시도하지 않도록 기본값을 끕니다.
    # Kafka 통합 테스트가 자기 클래스에서만 다시 켭니다.
    topic:
      auto-create: false
    listener:
      auto-startup: false

jwt:
  secret: MVB4n0vCRFADVbcto73tHp0Ghw2bWmriymBGLOuR2Q4=

tmdb:
  access-token: test-dummy-token
  image-base-url: https://image.tmdb.org/t/p/w500

sportsdb:
  api-key: test-dummy-key
  league-ids: 4569

external-content-batch:
  tmdb-max-pages: 1
  sportsdb-past-days: 0
  sportsdb-future-days: 0
  cron: "0 0 4 * * *"
  zone: Asia/Seoul

logging:
