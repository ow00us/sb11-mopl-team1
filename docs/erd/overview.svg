         many: 갈래 끝 x=12 = refX 12 → 갈래 끝이 노드 테두리에 정확히 닿음(파고들지도, 못 미치지도 않음).
               꼭짓점 (1,7)은 테두리에서 11유닛 뒤 = 경로 위 → 선이 꼭짓점을 지나 테두리까지 이어짐.
               관계선 <g>가 노드보다 위에 그려져 테두리에 닿는 갈래 끝이 안 가려짐. (index.html 과 동일)
         orient=auto-start-reverse: marker-start 로 쓰일 때(users→follows) 방향이 뒤집히지 않도록 -->
