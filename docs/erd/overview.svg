<!--
  README 썸네일용 미리보기입니다. 관계 정의의 기준은 docs/erd/index.html 이며,
  이 파일은 대략적인 배치만 보여줍니다. index.html 의 좌표와 1:1로 동기화하지 않습니다.
  레이아웃을 크게 바꿀 때만 이 파일을 함께 갱신하세요.
  (users 중앙 허브 재배치 + 도메인 zone 노드 완전 포함: 2026-08)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="810" viewBox="0 0 1400 810" role="img" aria-labelledby="title desc">
  <title id="title">MOPL 데이터베이스 관계 개요 (미리보기)</title>
  <desc id="desc">users를 중앙 허브로 두고 사용자·소셜 / 메시징·알림 / 콘텐츠·리뷰 / 플레이리스트 / 시청 세션 / 인프라 6개 도메인 17개 테이블을 각각 배경 구역으로 묶어 배치한 관계 미리보기. 정확한 정의는 상세 ERD 참고.</desc>
  <style>
    .edge { fill: none; stroke: #6b6b7d; stroke-width: 1.5; opacity: .72; }
    .edge-cascade { fill: none; stroke: #ff4a64; stroke-width: 1.9; opacity: .85; }
    .edge-app { fill: none; stroke: #6b6b7d; stroke-width: 1.5; stroke-dasharray: 5 5; opacity: .55; }
    .card { fill: #212126; stroke: #565666; stroke-width: 1; }
    .card-hub { fill: #2b2b31; stroke: #ff6c81; stroke-width: 1.6; }
    .card-sub { fill: #232329; stroke: #ff687e; stroke-width: 1.2; }
    .name { fill: #f2f2f3; font: 600 12px Consolas, monospace; }
    .meta { fill: #828291; font: 500 9px Arial, sans-serif; }
    .cluster { font: 700 12px Arial, sans-serif; letter-spacing: .08em; opacity: .62; }
    .lbl { fill: #9a9aa8; font: 600 10px Arial, sans-serif; }
    .caption { fill: #828291; font: 500 11px Arial, sans-serif; }
  </style>
  <rect width="1400" height="810" rx="20" fill="#131316"/>

