  <g transform="translate(1180 320)"><rect class="card" width="200" height="62" rx="10"/><circle cx="17" cy="18" r="4" fill="#4fb0a5"/><text class="name" x="30" y="23">outbox_events</text><text class="meta" x="17" y="45">Kafka 발행 대기열</text></g>
