    <path class="edge" d="M220 241 C560 241 560 351 900 351"/>
    <path class="edge" d="M220 251 C260 251 260 351 300 351"/>
    <path class="edge-strong" d="M500 121 C550 121 550 351 500 351"/>
    <path class="edge" d="M220 221 C250 221 250 441 220 441"/>
  </g>

  <g transform="translate(40 190)"><rect class="card" width="180" height="62" rx="10"/><circle cx="17" cy="18" r="4" fill="#ff4a64"/><text class="name" x="30" y="23">users</text><text class="meta" x="17" y="45">사용자·인증 중심</text></g>
  <g transform="translate(40 300)"><rect class="card" width="180" height="62" rx="10"/><circle cx="17" cy="18" r="4" fill="#ff4a64"/><text class="name" x="30" y="23">follows</text><text class="meta" x="17" y="45">사용자 관계</text></g>
  <g transform="translate(40 410)"><rect class="card" width="180" height="62" rx="10"/><circle cx="17" cy="18" r="4" fill="#ff4a64"/><text class="name" x="30" y="23">oauth_accounts</text><text class="meta" x="17" y="45">OAuth 연동 계정</text></g>

  <g transform="translate(300 0)"><rect class="card" width="200" height="58" rx="10"/><circle cx="17" cy="18" r="4" fill="#ff687e"/><text class="name" x="30" y="23">content_tags</text><text class="meta" x="17" y="43">콘텐츠 태그</text></g>
