<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
  <title id="title">MOPL 데이터베이스 관계 개요</title>
  <desc id="desc">사용자, 콘텐츠, 플레이리스트, 대화, 알림, 시청 세션과 인프라를 포함한 17개 테이블의 관계</desc>
  <style>
    .edge { fill: none; stroke: #565666; stroke-width: 1.5; opacity: .75; }
    .edge-strong { fill: none; stroke: #ff4a64; stroke-width: 1.8; opacity: .82; }
    .card { fill: #212126; stroke: #565666; stroke-width: 1; }
    .name { fill: #f2f2f3; font: 600 12px Consolas, monospace; }
    .meta { fill: #828291; font: 500 9px Arial, sans-serif; }
  </style>
  <rect width="1400" height="500" rx="20" fill="#131316"/>

