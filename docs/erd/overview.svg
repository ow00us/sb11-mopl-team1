<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">MOPL 애플리케이션 데이터베이스 관계 개요</title>
  <desc id="desc">Flyway V22 기준 17개 애플리케이션 테이블. users와 contents를 중심으로 외래 키 관계를 표시하고, reviews, follows, playlist subscriptions, playlist contents, conversation participants가 만드는 N:M 관계를 별도 배지로 강조한다.</desc>

  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131316"/>
      <stop offset=".58" stop-color="#09090b"/>
      <stop offset="1" stop-color="#010102"/>
    </linearGradient>
    <radialGradient id="pink-glow" cx="45%" cy="42%" r="58%">
      <stop offset="0" stop-color="#ff4a64" stop-opacity=".12"/>
      <stop offset=".58" stop-color="#ff4a64" stop-opacity=".025"/>
      <stop offset="1" stop-color="#ff4a64" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <filter id="hub-glow" x="-30%" y="-40%" width="160%" height="190%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".46"/>
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ff4a64" flood-opacity=".16"/>
    </filter>

    <marker id="one" viewBox="0 0 16 18" refX="8" refY="9" markerWidth="16" markerHeight="18" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M8 2V16" fill="none" stroke="#aaaab1" stroke-width="2.2"/>
    </marker>
    <marker id="many" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M2 9 16 2M2 9h14M2 9l14 7" fill="none" stroke="#aaaab1" stroke-width="2"/>
    </marker>
    <marker id="one-pink" viewBox="0 0 16 18" refX="8" refY="9" markerWidth="16" markerHeight="18" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M8 2V16" fill="none" stroke="#ff687e" stroke-width="2.4"/>
    </marker>
    <marker id="many-pink" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M2 9 16 2M2 9h14M2 9l14 7" fill="none" stroke="#ff687e" stroke-width="2.1"/>
    </marker>

    <style>
      .frame { fill: url(#canvas); stroke: #34343d; stroke-width: 2; }
      .eyebrow { fill: #ff687e; font: 700 13px Pretendard, -apple-system, "Segoe UI", sans-serif; letter-spacing: .15em; }
      .heading { fill: #fafafa; font: 750 29px Pretendard, -apple-system, "Segoe UI", sans-serif; letter-spacing: -.035em; }
      .subheading { fill: #828291; font: 500 14px Pretendard, -apple-system, "Segoe UI", sans-serif; }
      .metric-bg { fill: #212126; stroke: #34343d; }
      .metric-main { fill: #f2f2f3; font: 700 14px Pretendard, -apple-system, "Segoe UI", sans-serif; }
      .metric-sub { fill: #828291; font: 500 11px Pretendard, -apple-system, "Segoe UI", sans-serif; }
      .section-pill { fill: #212126; stroke: #34343d; }
      .section-label { fill: #ccccd6; font: 700 12px Pretendard, -apple-system, "Segoe UI", sans-serif; letter-spacing: .08em; }
      .section-dot.social { fill: #ff4a64; }
      .section-dot.content { fill: #ff687e; }
      .section-dot.playlist { fill: #aaaab1; }
      .section-dot.message { fill: #ccccd6; }
      .section-dot.presence { fill: #ce0045; }
      .section-dot.infra { fill: #676777; }

      .edge { fill: none; stroke: #676777; stroke-width: 2; opacity: .74; }
      .edge.cascade { stroke: #ff4a64; stroke-width: 2.4; opacity: .88; }
      .edge.application { stroke: #828291; stroke-dasharray: 8 7; opacity: .66; }
      .role-label { fill: #aaaab1; font: 600 11px Pretendard, -apple-system, "Segoe UI", sans-serif; }
      .role-bg { fill: #131316; stroke: #34343d; }

      .node rect.card { fill: #212126; stroke: #565666; stroke-width: 1.5; }
      .node.root rect.card { fill: #2a2a30; stroke: #ff4a64; stroke-width: 2; filter: url(#hub-glow); }
      .node.bridge rect.card { fill: #1b1b1f; stroke: #ff687e; stroke-width: 1.8; stroke-dasharray: 6 4; filter: url(#shadow); }
      .node.operational rect.card { fill: #17171a; stroke: #565666; }
      .node-name { fill: #f2f2f3; font: 650 17px ui-monospace, SFMono-Regular, Consolas, monospace; }
      .node-meta { fill: #aaaab1; font: 500 12px Pretendard, -apple-system, "Segoe UI", sans-serif; }
      .node:hover rect.card, .node:focus rect.card { stroke: #ff8c9d; stroke-width: 2.4; }
      .node:focus { outline: none; }
      .badge-bg { fill: #ff4a64; }
      .badge-text { fill: #fff; font: 800 10px Pretendard, -apple-system, "Segoe UI", sans-serif; letter-spacing: .05em; }
      .badge-bg.muted { fill: #34343d; stroke: #565666; }
      .badge-text.muted { fill: #ccccd6; }
      .legend { fill: #aaaab1; font: 500 12px Pretendard, -apple-system, "Segoe UI", sans-serif; }
      .legend-strong { fill: #f2f2f3; font-weight: 700; }
    </style>
  </defs>

  <rect class="frame" x="1" y="1" width="1598" height="978" rx="28"/>
  <rect x="1" y="1" width="1598" height="978" rx="28" fill="url(#pink-glow)"/>

  <g aria-hidden="true">
    <path d="M54 70c0-13.3 10.7-24 24-24h18c13.3 0 24 10.7 24 24v3c0 12.2-9.8 22-22 22h-3.7c-3.4 0-6.6 1.7-8.5 4.5l-5.5 8.2" fill="none" stroke="#ff4a64" stroke-width="6" stroke-linecap="round"/>
    <path d="m81 64 19 11-19 11Z" fill="#ff4a64"/>
  </g>
  <text class="eyebrow" x="144" y="55">MOPL DATABASE</text>
  <text class="heading" x="144" y="87">Application relationship map</text>
  <text class="subheading" x="144" y="111">PostgreSQL · Flyway V22 · framework metadata excluded</text>

  <g transform="translate(1190 38)">
    <rect class="metric-bg" width="112" height="58" rx="16"/>
    <text class="metric-main" x="16" y="25">17</text>
    <text class="metric-sub" x="16" y="44">app tables</text>
  </g>
  <g transform="translate(1314 38)">
