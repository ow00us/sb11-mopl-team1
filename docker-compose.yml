services:
  postgres:
    image: postgres:16
    container_name: mopl-postgres
    environment:
      POSTGRES_DB: mopl
      POSTGRES_USER: mopl
      POSTGRES_PASSWORD: mopl
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: mopl-redis
    ports:
      - "6379:6379"

  mailpit:
    # 팀원마다 동일한 버전의 로컬 SMTP 서버를 사용하도록 버전을 고정
    image: axllent/mailpit:v1.30.0
    container_name: mopl-mailpit

    ports:
      # Spring Boot가 비밀번호 초기화 메일을 전달하는 SMTP 포트
      - "1025:1025"

      # 브라우저에서 발송된 테스트 메일을 확인하는 Mailpit 웹 UI 포트
      - "8025:8025"

  kafka:
    image: apache/kafka:3.8.0
    container_name: mopl-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  # Elasticsearch — 심화 검색 착수 시 담당자가 주석을 풀어 활성화합니다.
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0

volumes:
  postgres-data:
