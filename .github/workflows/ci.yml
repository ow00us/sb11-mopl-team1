name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  # 운영 이미지를 다시 게시해야 할 때 쓰는 수동 실행입니다.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 빌드보다 먼저 실행한다. 버전이 중복되면 Flyway 가 해석 단계에서 실패해
      # 데이터베이스를 쓰는 테스트가 전부 initializationError 로 실패하는데,
      # 그 목록만으로는 원인을 찾기 어렵다.
      - name: Check migration versions
        run: bash scripts/check-migration-versions.sh

      - name: Test deployment script
        run: |
          bash deploy/test-ensure-aws-cli.sh
          bash deploy/test-deploy.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build & Test
        run: ./gradlew build

      - name: Upload Jacoco report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            build/reports/jacoco/test/html
            build/reports/jacoco/test/jacocoTestReport.xml

  container-smoke:
    name: Container smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mopl
          POSTGRES_USER: mopl
          POSTGRES_PASSWORD: mopl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mopl -d mopl"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Spring Mail이 활성화되면 Actuator가 SMTP 연결 상태도
    # 애플리케이션 health에 포함하므로 CI용 SMTP 서버를 함께 실행합니다.
      mailpit:
        image: axllent/mailpit:v1.30.0
        ports:
          - 1025:1025

    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag mopl:ci .

      - name: Verify non-root runtime user
        run: test "$(docker image inspect --format '{{.Config.User}}' mopl:ci)" = "mopl"

      - name: Build Elasticsearch image
        run: docker build --tag mopl-es:ci ./docker/elasticsearch

      - name: Start Elasticsearch container
        run: |
          docker run --detach \
            --name mopl-es-ci \
            --network host \
            --env discovery.type=single-node \
            --env xpack.security.enabled=false \
            --env ES_JAVA_OPTS="-Xms512m -Xmx512m" \
            mopl-es:ci

      # Kafka 는 services 블록이 아니라 step 에서 띄웁니다. KRaft 브로커는 광고 주소와
      # controller quorum 을 함께 맞춰야 하는데, services 블록은 기동 인자를 세밀하게
      # 조정하기 어렵고 준비 여부도 브로커 API 로 확인하는 편이 확실합니다.
      - name: Start Kafka broker
        run: |
          docker run --detach \
            --name mopl-ci-kafka \
            --network host \
            --env KAFKA_NODE_ID=1 \
            --env KAFKA_PROCESS_ROLES=broker,controller \
            --env KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            --env KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092 \
            --env KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            --env KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            --env KAFKA_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093 \
            --env KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            --env KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            --env KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            --env KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            --env KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            apache/kafka:3.7.1

      - name: Wait for Kafka broker
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            if docker exec mopl-ci-kafka /opt/kafka/bin/kafka-broker-api-versions.sh \
                 --bootstrap-server 127.0.0.1:9092 > /dev/null 2>&1; then
              echo "Kafka broker is ready."
              exit 0
            fi

            echo "Waiting for Kafka broker ($attempt/60)"
            sleep 2
          done

          echo "Kafka broker did not become ready in time."
          docker logs mopl-ci-kafka
          exit 1

      - name: Wait for Elasticsearch
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9200/_cluster/health >/dev/null 2>&1; then
              echo "Elasticsearch is ready."
              exit 0
            fi
            echo "Waiting for Elasticsearch ($attempt/60)"
            sleep 2
          done

          echo "Elasticsearch did not become ready in time."
          docker logs mopl-es-ci || true
          exit 1

      # 운영과 같은 순서입니다. 토픽을 먼저 준비하고 애플리케이션은 그것을 확인만 합니다.
      #
      # 목록은 MoplTopics 에서 뽑습니다. 여기에 손으로 적어 두면 토픽이 늘어날 때마다
      # 뒤처지고, 그 사실이 기동 실패로만 드러납니다.
      - name: Create required topics
        shell: bash
        run: |
          set -euo pipefail

          topics="$(grep --only-matching --extended-regexp '"mopl\.[a-z.-]+"' \
            src/main/java/com/mopl/global/event/MoplTopics.java | tr -d '"' | sort --unique)"

          # 상수 이름이나 파일 위치가 바뀌면 목록이 비는데, 그대로 두면 토픽을 하나도
          # 만들지 않고 다음 단계의 기동 실패로 넘어갑니다. 여기서 원인을 밝힙니다.
          if [[ -z "$topics" ]]; then
            echo "MoplTopics 에서 토픽 이름을 찾지 못했습니다. 추출 규칙을 확인하세요."
            exit 1
          fi

          echo "준비할 토픽:"
          echo "$topics"

          for topic in $topics; do
            for name in "$topic" "$topic.DLT"; do
              docker exec mopl-ci-kafka /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server 127.0.0.1:9092 \
                --create --if-not-exists \
                --topic "$name" --partitions 3 --replication-factor 1
            done
          done

          docker exec mopl-ci-kafka /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server 127.0.0.1:9092 --list

      # KAFKA_TOPIC_VERIFY 를 켭니다. 토픽이 준비된 환경이므로, 필요한 토픽이 하나라도
      # 없으면 기동이 실패해야 합니다. DLT 가 없으면 DLT 발행이 실패하면서 원본 처리까지
      # 막히므로 기동 시점에 드러내는 편이 낫습니다.
      - name: Start production container
        run: |
          docker run --detach \
            --name mopl-ci \
            --network host \
            --env SPRING_PROFILES_ACTIVE=prod \
            --env SPRING_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:5432/mopl \
            --env SPRING_DATASOURCE_USERNAME=mopl \
            --env SPRING_DATASOURCE_PASSWORD=mopl \
            --env SPRING_DATA_REDIS_HOST=127.0.0.1 \
            --env SPRING_DATA_REDIS_PORT=6379 \
            --env ELASTICSEARCH_URIS=http://127.0.0.1:9200 \
            --env MAIL_HOST=127.0.0.1 \
            --env MAIL_PORT=1025 \
            --env MAIL_SMTP_AUTH=false \
            --env MAIL_STARTTLS_ENABLE=false \
            --env JWT_SECRET=bW9wbC1jaS1zbW9rZS1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcy1sb25nISE= \
            --env CORS_ALLOWED_ORIGINS=http://localhost:5173 \
            --env WS_ALLOWED_ORIGINS=http://localhost:5173 \
            --env OAUTH2_SUCCESS_REDIRECT_URI=http://localhost:5173/oauth/callback \
            --env OAUTH2_FAILURE_REDIRECT_URI=http://localhost:5173/sign-in \
            --env OAUTH2_LOCAL_CREDENTIAL_VERIFICATION_SECRET=mopl-ci-oauth-local-credential-verification-secret \
            --env GOOGLE_OAUTH_CLIENT_ID=mopl-ci-google-client-id \
            --env GOOGLE_OAUTH_CLIENT_SECRET=mopl-ci-google-client-secret \
            --env GOOGLE_OAUTH_REDIRECT_URI=http://localhost:8080/login/oauth2/code/google \
            --env KAKAO_OAUTH_CLIENT_ID=mopl-ci-kakao-client-id \
            --env KAKAO_OAUTH_CLIENT_SECRET=mopl-ci-kakao-client-secret \
            --env KAKAO_OAUTH_REDIRECT_URI=http://localhost:8080/login/oauth2/code/kakao \
            --env NAVER_OAUTH_CLIENT_ID=mopl-ci-naver-client-id \
            --env NAVER_OAUTH_CLIENT_SECRET=mopl-ci-naver-client-secret \
            --env NAVER_OAUTH_REDIRECT_URI=http://localhost:8080/login/oauth2/code/naver \
            --env IMAGE_STORAGE_BUCKET=mopl-ci-images \
            --env IMAGE_STORAGE_PUBLIC_BASE_URL=http://127.0.0.1:9000/mopl-ci-images \
            --env KAFKA_BOOTSTRAP_SERVERS=127.0.0.1:9092 \
            --env KAFKA_TOPIC_VERIFY=true \
            mopl:ci

      - name: Wait for healthy application
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..90}; do
            container_status="$(docker inspect --format '{{.State.Status}}' mopl-ci)"
            health_status="$(docker inspect --format '{{.State.Health.Status}}' mopl-ci)"

            if [[ "$container_status" == "exited" || "$container_status" == "dead" ]]; then
              echo "Application container stopped before becoming healthy."
              docker logs mopl-ci
              exit 1
            fi

            # 컨테이너 healthcheck 는 liveness 만 봅니다. 그것이 healthy 가 됐다고 전체
            # 집계까지 UP 인 것은 아니므로, 여기서 한 번 실패했다고 끝내지 않고 다시 봅니다.
            if [[ "$health_status" == "healthy" ]]; then
              health_response="$(curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health || true)"

              if grep -q '"status":"UP"' <<< "$health_response"; then
                echo "$health_response"
                exit 0
              fi

              echo "Liveness is healthy but overall health is not UP yet: $health_response"
            fi

            echo "Waiting for application health ($attempt/90): $health_status"
            sleep 2
          done

          echo "Application did not become healthy in time."
          docker logs mopl-ci
          exit 1

      # 도메인 상태 변경 대신 Outbox 에 직접 한 건을 넣어 발행 경로를 확인합니다. 발행
      # 도메인이 아직 없으므로 이 방법이 relay·직렬화·토픽 결정을 한 번에 지나는 가장
      # 짧은 경로입니다. 소비까지 확인해야 계약이 왕복으로 성립하는지 알 수 있습니다.
      - name: Verify event round-trip through Outbox relay
        shell: bash
        run: |
          set -euo pipefail

          event_id="$(uuidgen)"
          aggregate_id="$(uuidgen)"
          echo "eventId=$event_id"

          docker run --rm --network host --env PGPASSWORD=mopl postgres:16 \
            psql --host 127.0.0.1 --username mopl --dbname mopl --set ON_ERROR_STOP=1 --command "
              INSERT INTO outbox_events (
                id, created_at, updated_at,
                event_id, type, version, aggregate_id, occurred_at, payload,
                partition_key, ordering_scope, deduplication_key,
                status, attempts, next_attempt_at
              ) VALUES (
                gen_random_uuid(), now(), now(),
                '$event_id', 'follow.created', 1, '$aggregate_id', now(),
                '{\"followerId\": \"$aggregate_id\"}'::jsonb,
                '$aggregate_id', 'AGGREGATE', 'follow.created:$aggregate_id',
                'PENDING', 0, now()
              );"

          docker exec mopl-ci-kafka /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server 127.0.0.1:9092 \
            --topic mopl.follow.events \
            --from-beginning --max-messages 1 --timeout-ms 60000 \
            > consumed-event.json

          cat consumed-event.json
          grep --quiet "$event_id" consumed-event.json

          # 발행 확인을 받은 뒤에만 완료로 바뀌어야 합니다. 소비된 것만 보면 Outbox 상태가
          # 대기로 남아 같은 이벤트가 다시 나가는 상황을 놓칩니다.
          for attempt in {1..30}; do
            status="$(docker run --rm --network host --env PGPASSWORD=mopl postgres:16 \
              psql --host 127.0.0.1 --username mopl --dbname mopl --tuples-only --no-align \
              --command "SELECT status FROM outbox_events WHERE event_id = '$event_id'")"

            if [[ "$status" == "PUBLISHED" ]]; then
              echo "Outbox record is marked published."
              exit 0
            fi

            echo "Waiting for outbox status ($attempt/30): $status"
            sleep 2
          done

          echo "Outbox record did not reach PUBLISHED."
          exit 1

      # 두 번째 인스턴스를 같은 Redis 로 띄웁니다. 기존 통합 테스트는 두 번째 구독자를 테스트
      # 안에서 직접 구성하므로 전체 애플리케이션의 설정·라우팅·인증 경계는 지나지 않습니다.
      # host 네트워크를 공유하므로 포트만 다르게 둡니다.
      - name: Start second application instance
        run: |
          docker run --detach \
            --name mopl-ci-b \
            --network host \
            --env SERVER_PORT=8081 \
            --env SPRING_PROFILES_ACTIVE=prod \
            --env SPRING_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:5432/mopl \
            --env SPRING_DATASOURCE_USERNAME=mopl \
            --env SPRING_DATASOURCE_PASSWORD=mopl \
            --env SPRING_DATA_REDIS_HOST=127.0.0.1 \
            --env SPRING_DATA_REDIS_PORT=6379 \
            --env ELASTICSEARCH_URIS=http://127.0.0.1:9200 \
            --env MAIL_HOST=127.0.0.1 \
            --env MAIL_PORT=1025 \
            --env MAIL_SMTP_AUTH=false \
            --env MAIL_STARTTLS_ENABLE=false \
            --env JWT_SECRET=bW9wbC1jaS1zbW9rZS1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcy1sb25nISE= \
            --env CORS_ALLOWED_ORIGINS=http://localhost:5173 \
            --env WS_ALLOWED_ORIGINS=http://localhost:5173 \
            --env OAUTH2_SUCCESS_REDIRECT_URI=http://localhost:5173/oauth/callback \
            --env OAUTH2_FAILURE_REDIRECT_URI=http://localhost:5173/sign-in \
            --env OAUTH2_LOCAL_CREDENTIAL_VERIFICATION_SECRET=mopl-ci-oauth-local-credential-verification-secret \
            --env GOOGLE_OAUTH_CLIENT_ID=mopl-ci-google-client-id \
            --env GOOGLE_OAUTH_CLIENT_SECRET=mopl-ci-google-client-secret \
            --env GOOGLE_OAUTH_REDIRECT_URI=http://localhost:8081/login/oauth2/code/google \
            --env KAKAO_OAUTH_CLIENT_ID=mopl-ci-kakao-client-id \
            --env KAKAO_OAUTH_CLIENT_SECRET=mopl-ci-kakao-client-secret \
            --env KAKAO_OAUTH_REDIRECT_URI=http://localhost:8081/login/oauth2/code/kakao \
            --env NAVER_OAUTH_CLIENT_ID=mopl-ci-naver-client-id \
            --env NAVER_OAUTH_CLIENT_SECRET=mopl-ci-naver-client-secret \
            --env NAVER_OAUTH_REDIRECT_URI=http://localhost:8081/login/oauth2/code/naver \
            --env IMAGE_STORAGE_BUCKET=mopl-ci-images \
            --env IMAGE_STORAGE_PUBLIC_BASE_URL=http://127.0.0.1:9000/mopl-ci-images \
            --env KAFKA_BOOTSTRAP_SERVERS=127.0.0.1:9092 \
            --env KAFKA_TOPIC_VERIFY=true \
            mopl:ci

      - name: Wait for second instance
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..90}; do
            container_status="$(docker inspect --format '{{.State.Status}}' mopl-ci-b)"

            if [[ "$container_status" == "exited" || "$container_status" == "dead" ]]; then
              echo "Second instance stopped before becoming ready."
              docker logs mopl-ci-b
              exit 1
            fi

            if curl --fail --silent http://127.0.0.1:8081/actuator/health/liveness > /dev/null; then
              echo "Second instance is live."
              exit 0
            fi

            echo "Waiting for second instance ($attempt/90): $container_status"
            sleep 2
          done

          echo "Second instance did not become ready in time."
          docker logs mopl-ci-b
          exit 1

      # Pub/Sub 은 메시지를 보관하지 않습니다. 구독이 붙은 것을 먼저 확인하고 발행해야 초기
      # 구독 경쟁으로 결과가 흔들리지 않습니다.
      - name: Verify realtime relay across two instances
        shell: bash
        run: |
          set -euo pipefail

          redis() {
            docker run --rm --network host redis:7 redis-cli -h 127.0.0.1 "$@"
          }

          subscriber_count() {
            redis PUBSUB NUMSUB mopl.realtime.messages | tail -1 | tr -d '\r'
          }

          wait_for_subscribers() {
            local expected="$1"
            for attempt in {1..60}; do
              if [[ "$(subscriber_count)" == "$expected" ]]; then
                return 0
              fi
              echo "Waiting for $expected relay subscribers ($attempt/60)"
              sleep 2
            done
            echo "Relay subscriber count did not reach $expected."
            return 1
          }

          # 지표 경로는 인증이 필요합니다. 공개 회원가입과 로그인 API 만 사용해 토큰을 얻습니다.
          csrf_token() {
            curl --fail --silent --cookie-jar /tmp/relay-cookies.txt \
              --cookie /tmp/relay-cookies.txt \
              http://127.0.0.1:8081/api/auth/csrf-token > /dev/null
            awk '$6 == "XSRF-TOKEN" { print $7 }' /tmp/relay-cookies.txt | tail -1
          }

          email="relay-smoke-$(date +%s)@mopl.test"
          password='RelaySmoke1!'

          curl --fail --silent --show-error \
            --cookie-jar /tmp/relay-cookies.txt --cookie /tmp/relay-cookies.txt \
            --header "Content-Type: application/json" \
            --header "X-XSRF-TOKEN: $(csrf_token)" \
            --data "{\"name\":\"relay smoke\",\"email\":\"$email\",\"password\":\"$password\"}" \
            http://127.0.0.1:8081/api/users > /dev/null

          token="$(curl --fail --silent --show-error \
            --cookie-jar /tmp/relay-cookies.txt --cookie /tmp/relay-cookies.txt \
            --header "Content-Type: application/json" \
            --header "X-XSRF-TOKEN: $(csrf_token)" \
            --data "{\"email\":\"$email\",\"password\":\"$password\"}" \
            http://127.0.0.1:8081/api/auth/sign-in | jq --raw-output '.accessToken')"

          test -n "$token"
          test "$token" != "null"

          metric() {
            local port="$1"
            local pattern="$2"
            curl --fail --silent --header "Authorization: Bearer $token" \
              "http://127.0.0.1:$port/actuator/prometheus" \
              | awk -v pattern="$pattern" '
                  $0 !~ /^#/ && $0 ~ pattern { value = $NF }
                  END { if (value != "") print value }
                '
          }

          # 지표 값은 1 이 아니라 1.0 처럼 나옵니다. 문자열로 비교하면 어긋납니다.
          assert_number() {
            awk -v actual="$1" -v expected="$2" -v label="$3" 'BEGIN {
              if (actual + 0 != expected + 0) {
                print label " expected " expected " but was " actual
                exit 1
              }
            }'
          }

          # 이 smoke 는 특정 도메인이 아니라 중계 자체를 봅니다. 그래서 어떤 handler 도
          # 지원하지 않는 eventType 을 보내고, 인스턴스를 건너와 self·duplicate 필터를
          # 통과했다는 사실을 no_handler 폐기 지표로 확인합니다. delivered 는 handler 까지
          # 넘어간 건수라 이 메시지에는 오르지 않습니다.
          no_handler="mopl_realtime_relay_discarded_messages_total.*no_handler"
          duplicate="mopl_realtime_relay_discarded_messages_total.*duplicate"

          # 두 인스턴스가 같은 채널을 구독합니다.
          wait_for_subscribers 2

          # 구독 상태가 각 인스턴스의 지표에도 드러나야 합니다.
          assert_number "$(metric 8080 '^mopl_realtime_relay_subscribed')" 1 "instance a subscribed"
          assert_number "$(metric 8081 '^mopl_realtime_relay_subscribed')" 1 "instance b subscribed"

          no_handler_a_before="$(metric 8080 "$no_handler")"
          no_handler_b_before="$(metric 8081 "$no_handler")"
          duplicate_b_before="$(metric 8081 "$duplicate")"

          message_id="$(uuidgen)"
          message="{\"messageId\":\"$message_id\",\"originInstanceId\":\"relay-smoke\","
          message="$message\"eventType\":\"notification.created\","
          message="$message\"destination\":\"/topic/user/1\",\"payload\":{\"body\":\"relay smoke\"}}"

          # 같은 messageId 를 두 번 보냅니다. 두 번 전달되면 사용자에게 두 번 갑니다.
          redis PUBLISH mopl.realtime.messages "$message" > /dev/null
          redis PUBLISH mopl.realtime.messages "$message" > /dev/null

          for attempt in {1..30}; do
            no_handler_a="$(metric 8080 "$no_handler")"
            no_handler_b="$(metric 8081 "$no_handler")"
            duplicate_b="$(metric 8081 "$duplicate")"

            if [[ "$no_handler_a" != "$no_handler_a_before" \
              && "$no_handler_b" != "$no_handler_b_before" \
              && "$duplicate_b" != "$duplicate_b_before" ]]; then
              break
            fi

            echo "Waiting for relay delivery ($attempt/30): a=$no_handler_a b=$no_handler_b"
            sleep 2
          done

          echo "no handler a: $no_handler_a_before -> $no_handler_a"
          echo "no handler b: $no_handler_b_before -> $no_handler_b"
          echo "duplicate b: $duplicate_b_before -> $duplicate_b"

          # 두 번 보냈지만 각 인스턴스에서 한 번만 처리 시도되어야 합니다.
          assert_number "$no_handler_a" "$((${no_handler_a_before%%.*} + 1))" "instance a no-handler discards"
          assert_number "$no_handler_b" "$((${no_handler_b_before%%.*} + 1))" "instance b no-handler discards"
          assert_number "$duplicate_b" "$((${duplicate_b_before%%.*} + 1))" "instance b duplicate discards"

          # 한 인스턴스가 내려가도 남은 인스턴스는 REST 와 자기 구독을 유지해야 합니다.
          docker stop mopl-ci > /dev/null
          wait_for_subscribers 1
          curl --fail --silent http://127.0.0.1:8081/actuator/health/liveness > /dev/null

          docker start mopl-ci > /dev/null
          wait_for_subscribers 2

          # 구독 연결을 끊습니다. 컨테이너를 재시작하는 것보다 이쪽이 확인하려는 상황에
          # 가깝습니다. 구독이 다시 붙어야 전달이 이어집니다.
          redis CLIENT KILL TYPE pubsub > /dev/null
          wait_for_subscribers 2

          no_handler_b_before="$(metric 8081 "$no_handler")"
          message="${message/$message_id/$(uuidgen)}"
          redis PUBLISH mopl.realtime.messages "$message" > /dev/null

          for attempt in {1..30}; do
            no_handler_b="$(metric 8081 "$no_handler")"

            if [[ "$no_handler_b" != "$no_handler_b_before" ]]; then
              echo "Relay delivery recovered after Redis restart."
              exit 0
            fi

            echo "Waiting for relay recovery ($attempt/30): $no_handler_b"
            sleep 2
          done
          echo "Relay delivery did not recover after Redis restart."
          exit 1

      - name: Print second instance logs on failure
        if: failure()
        run: docker logs mopl-ci-b || true

      - name: Print Redis diagnostics on failure
        if: failure()
        run: |
          docker run --rm --network host redis:7 redis-cli -h 127.0.0.1 \
            PUBSUB NUMSUB mopl.realtime.messages || true
          docker run --rm --network host redis:7 redis-cli -h 127.0.0.1 INFO clients || true

      - name: Print application logs on failure
        if: failure()
        run: docker logs mopl-ci || true

      - name: Print Kafka diagnostics on failure
        if: failure()
        run: |
          docker logs mopl-ci-kafka || true
          docker exec mopl-ci-kafka /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server 127.0.0.1:9092 --describe || true

      - name: Remove smoke container
        if: always()
        run: docker rm --force mopl-ci mopl-ci-b mopl-ci-kafka || true

      - name: Remove Elasticsearch container
        if: always()
        run: docker rm --force mopl-es-ci || true


  publish-image:
    name: Publish image
    needs: [build, container-smoke]
    outputs:
      backend_image: ${{ steps.image.outputs.reference }}
    # main/develop push 와 해당 브랜치의 수동 재게시에서만 게시합니다. PR 에서는 태그를
    # 만들지 않습니다. 검증되지 않은 커밋의 태그가 레지스트리에 남으면 배포 대상을
    # 고를 때 무엇이 검증된 것인지 구분할 수 없습니다.
    #
    # ECR_REPOSITORY 가 비어 있으면 건너뜁니다. AWS 리소스와 OIDC 역할은 #348 이
    # 만듭니다. develop 은 production SSM 권한이 섞인 역할을 쓰지 않고, 별도의
    # AWS_STAGING_PUBLISH_ROLE_ARN 이 준비된 뒤에만 게시합니다.
    if: >-
      ${{ success()
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
      && vars.ECR_REPOSITORY != ''
      && (github.ref == 'refs/heads/main' || vars.AWS_STAGING_PUBLISH_ROLE_ARN != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # OIDC 로 IAM 역할을 맡습니다. 장기 registry 자격 증명을 저장소에 두지 않습니다.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 기존 역할은 production EC2 SSM 권한도 있으므로 develop 에서 맡지 않습니다.
          role-to-assume: >-
            ${{ github.ref == 'refs/heads/main'
            && vars.AWS_DEPLOY_ROLE_ARN
            || vars.AWS_STAGING_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 태그를 둘 만듭니다. commit SHA 태그는 배포와 rollback 의 기준입니다. 브랜치 태그는
      # 사람이 각 환경의 최신을 확인하는 용도이고 main 또는 develop 을 가리킵니다.
      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.ref_name }}
          # 레이어 캐시는 입력이 바뀌면 무효화됩니다. 소스를 COPY 하는 단계가 커밋마다
          # 달라지므로 그 뒤 단계는 캐시를 쓰지 않습니다. 오래된 소스가 남지 않습니다.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # 게시한 것이 곧 배포할 것입니다. 로컬 빌드 결과가 아니라 레지스트리에서 digest 로
      # 다시 받아 확인해야 그 사이에 다른 것이 올라가지 않았음이 드러납니다.
      - name: Verify published image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail

          docker pull "$IMAGE"

          user="$(docker image inspect --format '{{.Config.User}}' "$IMAGE")"
          if [[ "$user" != "mopl" ]]; then
            echo "게시 이미지의 기본 사용자가 비특권 사용자가 아닙니다: '$user'"
            exit 1
          fi

          healthcheck="$(docker image inspect --format '{{json .Config.Healthcheck}}' "$IMAGE")"
          if [[ "$healthcheck" == "null" ]]; then
            echo "게시 이미지에 healthcheck 메타데이터가 없습니다."
            exit 1
          fi

          echo "$healthcheck"
          grep --quiet "actuator/health/liveness" <<< "$healthcheck"

      # 후속 배포와 rollback 이 이 값을 씁니다. 실행 로그를 뒤지지 않고 찾을 수 있어야
      # 합니다.
      - name: Record image reference
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "reference=$REGISTRY/$REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"

          {
            echo "### 게시한 ${{ github.ref_name }} 이미지"
            echo
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| 불변 태그 | \`$REGISTRY/$REPOSITORY:${{ github.sha }}\` |"
            echo "| 이동 태그 | \`$REGISTRY/$REPOSITORY:${{ github.ref_name }}\` |"
            echo "| digest | \`$DIGEST\` |"
            echo
            echo "배포와 rollback 은 digest 또는 commit SHA 태그를 사용합니다. \`${{ github.ref_name }}\` 태그는 사람이 해당 환경의 최신을 확인하는 용도입니다."
          } >> "$GITHUB_STEP_SUMMARY"

  # PR 은 배포하지 않습니다. develop 에 실제로 반영된 commit 을 전체 CI 와 Container
  # Smoke 가 검증하고 ECR 게시까지 끝낸 뒤에만 staging 으로 보냅니다.
  deploy-staging:
    name: Deploy staging
    needs: publish-image
    if: >-
      ${{ github.event_name == 'push'
      && github.ref == 'refs/heads/develop'
      && needs.publish-image.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      target_environment: staging
      backend_image: ${{ needs.publish-image.outputs.backend_image }}
      allow_destructive_migration: false

  # main 에 실제로 반영된 commit 만 운영 배포 후보가 됩니다. 호출된 deploy workflow 의
  # production Environment 승인 전에는 job 이 시작되지 않으므로, 이미지 게시 성공만으로
  # 운영 EC2 가 바뀌지 않습니다. 승인 후에도 파괴적 마이그레이션은 자동 허용하지 않습니다.
  deploy-production:
    name: Deploy production
    needs: publish-image
    if: >-
      ${{ github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.publish-image.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      target_environment: production
      backend_image: ${{ needs.publish-image.outputs.backend_image }}
      allow_destructive_migration: false

  coverage-upload:
    name: Coverage upload
    needs: [build, container-smoke]
    if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Codecov 는 리포트 안의 경로를 Git 소스 파일과 대조합니다. 별도 업로드
      # job 에서도 같은 commit 을 checkout 해야 유효한 파일로 처리할 수 있습니다.
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download Jacoco report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: coverage

      - name: Upload main coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/jacocoTestReport.xml
          disable_search: true
          root_dir: ${{ github.workspace }}
          fail_ci_if_error: true
          use_oidc: true
          verbose: true
