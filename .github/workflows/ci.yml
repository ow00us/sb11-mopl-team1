name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 빌드보다 먼저 실행한다. 버전이 중복되면 Flyway 가 해석 단계에서 실패해
      # 데이터베이스를 쓰는 테스트가 전부 initializationError 로 실패하는데,
      # 그 목록만으로는 원인을 찾기 어렵다.
      - name: Check migration versions
        run: bash scripts/check-migration-versions.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build & Test
        run: ./gradlew build

      - name: Upload Jacoco report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            build/reports/jacoco/test/html
            build/reports/jacoco/test/jacocoTestReport.xml

  container-smoke:
    name: Container smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mopl
          POSTGRES_USER: mopl
          POSTGRES_PASSWORD: mopl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mopl -d mopl"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl --fail --silent http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag mopl:ci .

      - name: Verify non-root runtime user
        run: test "$(docker image inspect --format '{{.Config.User}}' mopl:ci)" = "mopl"

      # 이 job 은 컨테이너가 정상 기동해 healthy 가 되는지만 봅니다. Kafka 브로커는
      # 띄우지 않고 주소만 넘깁니다. prod 는 토픽을 생성하지도 검증하지도 않고 도메인
      # 리스너가 아직 없어 기동 중 브로커에 접속하지 않습니다.
      - name: Start production container
        run: |
          docker run --detach \
            --name mopl-ci \
            --network host \
            --env SPRING_PROFILES_ACTIVE=prod \
            --env SPRING_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:5432/mopl \
            --env SPRING_DATASOURCE_USERNAME=mopl \
            --env SPRING_DATASOURCE_PASSWORD=mopl \
            --env SPRING_DATA_REDIS_HOST=127.0.0.1 \
            --env SPRING_DATA_REDIS_PORT=6379 \
            --env ELASTICSEARCH_URIS=http://127.0.0.1:9200 \
            --env JWT_SECRET=bW9wbC1jaS1zbW9rZS1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcy1sb25nISE= \
            --env CORS_ALLOWED_ORIGINS=http://localhost:5173 \
            --env WS_ALLOWED_ORIGINS=http://localhost:5173 \
            --env KAFKA_BOOTSTRAP_SERVERS=127.0.0.1:9092 \
            mopl:ci

      - name: Wait for healthy application
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..90}; do
            container_status="$(docker inspect --format '{{.State.Status}}' mopl-ci)"
            health_status="$(docker inspect --format '{{.State.Health.Status}}' mopl-ci)"

            if [[ "$container_status" == "exited" || "$container_status" == "dead" ]]; then
              echo "Application container stopped before becoming healthy."
              docker logs mopl-ci
              exit 1
            fi

            if [[ "$health_status" == "healthy" ]]; then
              health_response="$(curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health)"
              echo "$health_response"
              grep -q '"status":"UP"' <<< "$health_response"
              exit 0
            fi

            echo "Waiting for application health ($attempt/90): $health_status"
            sleep 2
          done

          echo "Application did not become healthy in time."
          docker logs mopl-ci
          exit 1

      - name: Print application logs on failure
        if: failure()
        run: docker logs mopl-ci || true

      - name: Remove smoke container
        if: always()
        run: docker rm --force mopl-ci || true

  coverage-upload:
    name: Coverage upload
    needs: [build, container-smoke]
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Jacoco report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: coverage

      - name: Upload main coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/jacocoTestReport.xml
          fail_ci_if_error: true
          use_oidc: true
