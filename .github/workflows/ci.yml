name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 빌드보다 먼저 실행한다. 버전이 중복되면 Flyway 가 해석 단계에서 실패해
      # 데이터베이스를 쓰는 테스트가 전부 initializationError 로 실패하는데,
      # 그 목록만으로는 원인을 찾기 어렵다.
      - name: Check migration versions
        run: bash scripts/check-migration-versions.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build & Test
        run: ./gradlew build

      - name: Upload Jacoco report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            build/reports/jacoco/test/html
            build/reports/jacoco/test/jacocoTestReport.xml

  container-smoke:
    name: Container smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mopl
          POSTGRES_USER: mopl
          POSTGRES_PASSWORD: mopl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mopl -d mopl"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Spring Mail이 활성화되면 Actuator가 SMTP 연결 상태도
    # 애플리케이션 health에 포함하므로 CI용 SMTP 서버를 함께 실행합니다.
      mailpit:
        image: axllent/mailpit:v1.30.0
        ports:
          - 1025:1025

    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag mopl:ci .

      - name: Verify non-root runtime user
        run: test "$(docker image inspect --format '{{.Config.User}}' mopl:ci)" = "mopl"

      - name: Build Elasticsearch image
        run: docker build --tag mopl-es:ci ./docker/elasticsearch

      - name: Start Elasticsearch container
        run: |
          docker run --detach \
            --name mopl-es-ci \
            --network host \
            --env discovery.type=single-node \
            --env xpack.security.enabled=false \
            --env ES_JAVA_OPTS="-Xms512m -Xmx512m" \
            mopl-es:ci

      # Kafka 는 services 블록이 아니라 step 에서 띄웁니다. KRaft 브로커는 광고 주소와
      # controller quorum 을 함께 맞춰야 하는데, services 블록은 기동 인자를 세밀하게
      # 조정하기 어렵고 준비 여부도 브로커 API 로 확인하는 편이 확실합니다.
      - name: Start Kafka broker
        run: |
          docker run --detach \
            --name mopl-ci-kafka \
            --network host \
            --env KAFKA_NODE_ID=1 \
            --env KAFKA_PROCESS_ROLES=broker,controller \
            --env KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            --env KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092 \
            --env KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            --env KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            --env KAFKA_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093 \
            --env KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            --env KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            --env KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            --env KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            --env KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            apache/kafka:3.7.1

      - name: Wait for Kafka broker
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            if docker exec mopl-ci-kafka /opt/kafka/bin/kafka-broker-api-versions.sh \
                 --bootstrap-server 127.0.0.1:9092 > /dev/null 2>&1; then
              echo "Kafka broker is ready."
              exit 0
            fi

            echo "Waiting for Kafka broker ($attempt/60)"
            sleep 2
          done

          echo "Kafka broker did not become ready in time."
          docker logs mopl-ci-kafka
          exit 1

      - name: Wait for Elasticsearch
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9200/_cluster/health >/dev/null 2>&1; then
              echo "Elasticsearch is ready."
              exit 0
            fi
            echo "Waiting for Elasticsearch ($attempt/60)"
            sleep 2
          done

          echo "Elasticsearch did not become ready in time."
          docker logs mopl-es-ci || true
          exit 1

      # 운영과 같은 순서입니다. 토픽을 먼저 준비하고 애플리케이션은 그것을 확인만 합니다.
      #
      # 목록은 MoplTopics 에서 뽑습니다. 여기에 손으로 적어 두면 토픽이 늘어날 때마다
      # 뒤처지고, 그 사실이 기동 실패로만 드러납니다.
      - name: Create required topics
        shell: bash
        run: |
          set -euo pipefail

          topics="$(grep --only-matching --extended-regexp '"mopl\.[a-z.-]+"' \
            src/main/java/com/mopl/global/event/MoplTopics.java | tr -d '"' | sort --unique)"

          # 상수 이름이나 파일 위치가 바뀌면 목록이 비는데, 그대로 두면 토픽을 하나도
          # 만들지 않고 다음 단계의 기동 실패로 넘어갑니다. 여기서 원인을 밝힙니다.
          if [[ -z "$topics" ]]; then
            echo "MoplTopics 에서 토픽 이름을 찾지 못했습니다. 추출 규칙을 확인하세요."
            exit 1
          fi

          echo "준비할 토픽:"
          echo "$topics"

          for topic in $topics; do
            for name in "$topic" "$topic.DLT"; do
              docker exec mopl-ci-kafka /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server 127.0.0.1:9092 \
                --create --if-not-exists \
                --topic "$name" --partitions 3 --replication-factor 1
            done
          done

          docker exec mopl-ci-kafka /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server 127.0.0.1:9092 --list

      # KAFKA_TOPIC_VERIFY 를 켭니다. 토픽이 준비된 환경이므로, 필요한 토픽이 하나라도
      # 없으면 기동이 실패해야 합니다. DLT 가 없으면 DLT 발행이 실패하면서 원본 처리까지
      # 막히므로 기동 시점에 드러내는 편이 낫습니다.
      - name: Start production container
        run: |
          docker run --detach \
            --name mopl-ci \
            --network host \
            --env SPRING_PROFILES_ACTIVE=prod \
            --env SPRING_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:5432/mopl \
            --env SPRING_DATASOURCE_USERNAME=mopl \
            --env SPRING_DATASOURCE_PASSWORD=mopl \
            --env SPRING_DATA_REDIS_HOST=127.0.0.1 \
            --env SPRING_DATA_REDIS_PORT=6379 \
            --env ELASTICSEARCH_URIS=http://127.0.0.1:9200 \
            --env MAIL_HOST=127.0.0.1 \
            --env MAIL_PORT=1025 \
            --env MAIL_SMTP_AUTH=false \
            --env MAIL_STARTTLS_ENABLE=false \
            --env JWT_SECRET=bW9wbC1jaS1zbW9rZS1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcy1sb25nISE= \
            --env CORS_ALLOWED_ORIGINS=http://localhost:5173 \
            --env WS_ALLOWED_ORIGINS=http://localhost:5173 \
            --env OAUTH2_SUCCESS_REDIRECT_URI=http://localhost:5173/oauth/callback \
            --env OAUTH2_FAILURE_REDIRECT_URI=http://localhost:5173/sign-in \
            --env KAFKA_BOOTSTRAP_SERVERS=127.0.0.1:9092 \
            --env KAFKA_TOPIC_VERIFY=true \
            mopl:ci

      - name: Wait for healthy application
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..90}; do
            container_status="$(docker inspect --format '{{.State.Status}}' mopl-ci)"
            health_status="$(docker inspect --format '{{.State.Health.Status}}' mopl-ci)"

            if [[ "$container_status" == "exited" || "$container_status" == "dead" ]]; then
              echo "Application container stopped before becoming healthy."
              docker logs mopl-ci
              exit 1
            fi

            # 컨테이너 healthcheck 는 liveness 만 봅니다. 그것이 healthy 가 됐다고 전체
            # 집계까지 UP 인 것은 아니므로, 여기서 한 번 실패했다고 끝내지 않고 다시 봅니다.
            if [[ "$health_status" == "healthy" ]]; then
              health_response="$(curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health || true)"

              if grep -q '"status":"UP"' <<< "$health_response"; then
                echo "$health_response"
                exit 0
              fi

              echo "Liveness is healthy but overall health is not UP yet: $health_response"
            fi

            echo "Waiting for application health ($attempt/90): $health_status"
            sleep 2
          done

          echo "Application did not become healthy in time."
          docker logs mopl-ci
          exit 1

      # 도메인 상태 변경 대신 Outbox 에 직접 한 건을 넣어 발행 경로를 확인합니다. 발행
      # 도메인이 아직 없으므로 이 방법이 relay·직렬화·토픽 결정을 한 번에 지나는 가장
      # 짧은 경로입니다. 소비까지 확인해야 계약이 왕복으로 성립하는지 알 수 있습니다.
      - name: Verify event round-trip through Outbox relay
        shell: bash
        run: |
          set -euo pipefail

          event_id="$(uuidgen)"
          aggregate_id="$(uuidgen)"
          echo "eventId=$event_id"

          docker run --rm --network host --env PGPASSWORD=mopl postgres:16 \
            psql --host 127.0.0.1 --username mopl --dbname mopl --set ON_ERROR_STOP=1 --command "
              INSERT INTO outbox_events (
                id, created_at, updated_at,
                event_id, type, version, aggregate_id, occurred_at, payload,
                partition_key, ordering_scope, deduplication_key,
                status, attempts, next_attempt_at
              ) VALUES (
                gen_random_uuid(), now(), now(),
                '$event_id', 'follow.created', 1, '$aggregate_id', now(),
                '{\"followerId\": \"$aggregate_id\"}'::jsonb,
                '$aggregate_id', 'AGGREGATE', 'follow.created:$aggregate_id',
                'PENDING', 0, now()
              );"

          docker exec mopl-ci-kafka /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server 127.0.0.1:9092 \
            --topic mopl.follow.events \
            --from-beginning --max-messages 1 --timeout-ms 60000 \
            > consumed-event.json

          cat consumed-event.json
          grep --quiet "$event_id" consumed-event.json

          # 발행 확인을 받은 뒤에만 완료로 바뀌어야 합니다. 소비된 것만 보면 Outbox 상태가
          # 대기로 남아 같은 이벤트가 다시 나가는 상황을 놓칩니다.
          for attempt in {1..30}; do
            status="$(docker run --rm --network host --env PGPASSWORD=mopl postgres:16 \
              psql --host 127.0.0.1 --username mopl --dbname mopl --tuples-only --no-align \
              --command "SELECT status FROM outbox_events WHERE event_id = '$event_id'")"

            if [[ "$status" == "PUBLISHED" ]]; then
              echo "Outbox record is marked published."
              exit 0
            fi

            echo "Waiting for outbox status ($attempt/30): $status"
            sleep 2
          done

          echo "Outbox record did not reach PUBLISHED."
          exit 1

      - name: Print application logs on failure
        if: failure()
        run: docker logs mopl-ci || true

      - name: Print Kafka diagnostics on failure
        if: failure()
        run: |
          docker logs mopl-ci-kafka || true
          docker exec mopl-ci-kafka /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server 127.0.0.1:9092 --describe || true

      - name: Remove smoke container
        if: always()
        run: docker rm --force mopl-ci mopl-ci-kafka || true

      - name: Remove Elasticsearch container
        if: always()
        run: docker rm --force mopl-es-ci || true

  coverage-upload:
    name: Coverage upload
    needs: [build, container-smoke]
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Jacoco report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: coverage

      - name: Upload main coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/jacocoTestReport.xml
          fail_ci_if_error: true
          use_oidc: true
