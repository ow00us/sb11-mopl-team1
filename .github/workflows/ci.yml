name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build & Test
        run: ./gradlew build

      - name: Upload Jacoco report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html

  container-smoke:
    name: Container smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mopl
          POSTGRES_USER: mopl
          POSTGRES_PASSWORD: mopl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mopl -d mopl"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag mopl:ci .

      - name: Verify non-root runtime user
        run: test "$(docker image inspect --format '{{.Config.User}}' mopl:ci)" = "mopl"

      - name: Start production container
        run: |
          docker run --detach \
            --name mopl-ci \
            --network host \
            --env SPRING_PROFILES_ACTIVE=prod \
            --env SPRING_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:5432/mopl \
            --env SPRING_DATASOURCE_USERNAME=mopl \
            --env SPRING_DATASOURCE_PASSWORD=mopl \
            --env SPRING_DATA_REDIS_HOST=127.0.0.1 \
            --env SPRING_DATA_REDIS_PORT=6379 \
            --env JWT_SECRET=bW9wbC1jaS1zbW9rZS1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcy1sb25nISE= \
            --env CORS_ALLOWED_ORIGINS=http://localhost:5173 \
            --env WS_ALLOWED_ORIGINS=http://localhost:5173 \
            mopl:ci

      - name: Wait for healthy application
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            container_status="$(docker inspect --format '{{.State.Status}}' mopl-ci)"
            health_status="$(docker inspect --format '{{.State.Health.Status}}' mopl-ci)"

            if [[ "$container_status" == "exited" || "$container_status" == "dead" ]]; then
              echo "Application container stopped before becoming healthy."
              docker logs mopl-ci
              exit 1
            fi

            if [[ "$health_status" == "healthy" ]]; then
              health_response="$(curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health)"
              echo "$health_response"
              grep -q '"status":"UP"' <<< "$health_response"
              exit 0
            fi

            echo "Waiting for application health ($attempt/60): $health_status"
            sleep 2
          done

          echo "Application did not become healthy in time."
          docker logs mopl-ci
          exit 1

      - name: Print application logs on failure
        if: failure()
        run: docker logs mopl-ci || true

      - name: Remove smoke container
        if: always()
        run: docker rm --force mopl-ci || true
