name: Deploy

# 자동으로 돌지 않습니다. 배포 시점은 사람이 정합니다. main push 마다 운영에 나가면
# 되돌릴 판단을 할 사람이 없는 시간에도 배포가 일어납니다.
on:
  workflow_dispatch:
    inputs:
      backend_image:
        description: '배포할 백엔드 이미지. digest(@sha256:...) 또는 commit SHA 태그'
        required: true
        type: string
      frontend_image:
        description: '배포할 프론트엔드 이미지. 비우면 지금 것을 그대로 둡니다'
        required: false
        type: string
      allow_destructive_migration:
        description: '역호환되지 않는 마이그레이션을 알고도 진행합니다'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# 같은 환경에 배포가 겹치면 두 스크립트가 같은 env 파일과 같은 컨테이너를 동시에
# 건드립니다. 어느 이미지가 남는지도 정해지지 않습니다. 진행 중인 것을 취소하지 않고
# 기다립니다 - 배포 도중 취소는 절반만 교체된 상태를 남깁니다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 보호된 environment 입니다. 승인자와 대상 브랜치 제한은 저장소 설정에 둡니다.
    environment:
      name: production
      url: https://${{ vars.MOPL_DOMAIN }}

    steps:
      # 마이그레이션 비교에 이력이 필요합니다. 얕은 clone 이면 이전 배포 commit 을
      # 찾지 못하고, 그러면 확인 절차가 통과가 아니라 실패로 끝납니다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve currently deployed commit
        id: current
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # 서버가 남긴 배포 기록에서 직전 commit 을 읽습니다. 첫 배포라면 비어 있습니다.
          deployed="$(ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER@$HOST" \
            "sed -n 's/^DEPLOY_COMMIT=//p' /etc/mopl/deploy-state.env 2>/dev/null || true")"

          echo "commit=${deployed}" >> "$GITHUB_OUTPUT"
          echo "직전 배포 commit: ${deployed:-(없음)}"

      # 이미지 rollback 은 스키마를 되돌리지 않습니다. 되돌려도 고장난 채로 남는
      # 변경이 섞여 있으면 배포 전에 막습니다.
      - name: Check migration compatibility
        if: ${{ steps.current.outputs.commit != '' }}
        env:
          ALLOW_DESTRUCTIVE_MIGRATION: ${{ inputs.allow_destructive_migration }}
        run: |
          bash deploy/check-destructive-migration.sh \
            "${{ steps.current.outputs.commit }}" "${{ github.sha }}"

      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          FRONTEND_IMAGE: ${{ inputs.frontend_image }}
        run: |
          set -euo pipefail

          # 서버에 있는 사본이 아니라 이번 commit 의 스크립트를 보냅니다. 서버 사본은
          # 언제 갱신됐는지 알 수 없어, 배포되는 코드와 배포하는 절차가 어긋납니다.
          scp -i ~/.ssh/id_deploy -o BatchMode=yes \
            deploy/deploy.sh "$USER@$HOST:/srv/mopl/app/deploy/deploy.sh"

          remote="bash /srv/mopl/app/deploy/deploy.sh"
          remote+=" --backend-image $(printf '%q' "$BACKEND_IMAGE")"
          remote+=" --commit $(printf '%q' "${{ github.sha }}")"
          if [[ -n "$FRONTEND_IMAGE" ]]; then
            remote+=" --frontend-image $(printf '%q' "$FRONTEND_IMAGE")"
          fi

          # -o BatchMode=yes: 자격 증명을 물어보지 않고 실패합니다. 프롬프트가 뜨면
          # 30분 timeout 까지 붙잡고 있습니다.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER@$HOST" "$remote"

      # 실패한 배포도 무엇을 시도했는지 남아야 합니다. 실행 로그를 뒤지지 않고 찾을 수
      # 있어야 다음 판단이 빨라집니다.
      - name: Record deployment
        if: always()
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          state="$(ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER@$HOST" \
            "cat /etc/mopl/deploy-state.env 2>/dev/null || true")"

          {
            echo "### 배포 결과"
            echo
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| 백엔드 이미지 | \`${{ inputs.backend_image }}\` |"
            echo "| 프론트 이미지 | \`${{ inputs.frontend_image || '(변경 없음)' }}\` |"
            echo "| 직전 commit | \`${{ steps.current.outputs.commit || '(없음)' }}\` |"
            echo "| 결과 | \`${{ job.status }}\` |"
            echo
            if [[ -n "$state" ]]; then
              echo '```'
              echo "$state"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove deploy key
        if: always()
        run: rm -f ~/.ssh/id_deploy
