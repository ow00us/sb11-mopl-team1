name: Deploy

# staging 은 develop push 의 CI 가 검증한 불변 digest 를 자동 배포합니다. production 은
# main push 가 검증한 digest 로 승인 요청을 만들고, Environment 승인 뒤에만 배포합니다.
# 수동 실행 경로는 긴급 재배포와 rollback 용도로 계속 유지합니다.
on:
  workflow_call:
    inputs:
      target_environment:
        description: '배포 대상 환경'
        required: true
        type: string
      backend_image:
        description: '배포할 백엔드 불변 이미지'
        required: true
        type: string
      frontend_image:
        description: '배포할 프론트엔드 이미지. 비우면 지금 것을 그대로 둡니다'
        required: false
        default: ''
        type: string
      allow_destructive_migration:
        description: '역호환되지 않는 마이그레이션을 알고도 진행합니다'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      target_environment:
        description: '배포 대상 환경'
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
      backend_image:
        description: '배포할 백엔드 이미지. digest(@sha256:...) 또는 commit SHA 태그'
        required: true
        type: string
      frontend_image:
        description: '배포할 프론트엔드 이미지. 비우면 지금 것을 그대로 둡니다'
        required: false
        type: string
      allow_destructive_migration:
        description: '역호환되지 않는 마이그레이션을 알고도 진행합니다'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# 같은 환경에 배포가 겹치면 두 스크립트가 같은 env 파일과 같은 컨테이너를 동시에
# 건드립니다. 어느 이미지가 남는지도 정해지지 않습니다. 진행 중인 것을 취소하지 않고
# 기다립니다 - 배포 도중 취소는 절반만 교체된 상태를 남깁니다.
concurrency:
  group: deploy-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.target_environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # OIDC 로 IAM 역할을 맡습니다. 장기 자격 증명을 저장소에 두지 않습니다.
      id-token: write
    # environment 별 승인자·대상 브랜치·AWS 역할·EC2 ID 는 저장소 설정에서 분리합니다.
    environment:
      name: ${{ inputs.target_environment }}
      url: https://${{ vars.MOPL_DOMAIN }}

    steps:
      # 마이그레이션 비교에 이력이 필요합니다. 얕은 clone 이면 이전 배포 commit 을
      # 찾지 못하고, 그러면 확인 절차가 통과가 아니라 실패로 끝납니다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 환경 변수가 빠졌을 때 AWS action 의 모호한 인증 오류로 넘어가지 않습니다.
      # workflow_call 의 target 은 문자열이므로 수동 choice 와 같은 범위를 여기서도
      # 보장합니다.
      - name: Validate deployment configuration
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          DEPLOY_INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
          MOPL_DOMAIN: ${{ vars.MOPL_DOMAIN }}
        run: |
          set -euo pipefail

          case "$TARGET_ENVIRONMENT" in
            production|staging) ;;
            *) echo "지원하지 않는 배포 환경입니다: $TARGET_ENVIRONMENT"; exit 1 ;;
          esac

          for variable in AWS_DEPLOY_ROLE_ARN AWS_REGION DEPLOY_INSTANCE_ID MOPL_DOMAIN; do
            [[ -n "${!variable}" ]] || {
              echo "$TARGET_ENVIRONMENT Environment 에 $variable 변수가 없습니다."
              exit 1
            }
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve currently deployed commit
        id: current
        env:
          INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
        run: |
          set -euo pipefail

          cid="$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["sed -n \"s/^DEPLOY_COMMIT=//p\" /etc/mopl/deploy-state.env 2>/dev/null || true"]' \
            --query 'Command.CommandId' --output text)"
          sleep 5

          deployed="$(aws ssm get-command-invocation --command-id "$cid" \
            --instance-id "$INSTANCE_ID" --query StandardOutputContent \
            --output text 2>/dev/null | tr -d '[:space:]')"

          echo "commit=$deployed" >> "$GITHUB_OUTPUT"
          echo "직전 배포 commit: ${deployed:-(없음)}"

      # 이미지 rollback 은 스키마를 되돌리지 않습니다. 되돌려도 고장난 채로 남는
      # 변경이 섞여 있으면 배포 전에 막습니다.
      #
      # 첫 배포는 비교할 대상이 없어 건너뜁니다. 그때는 빈 스키마이므로 되돌릴
      # 이전 상태 자체가 없습니다.
      - name: Check migration compatibility
        if: ${{ steps.current.outputs.commit != '' }}
        env:
          ALLOW_DESTRUCTIVE_MIGRATION: ${{ inputs.allow_destructive_migration }}
        run: |
          bash deploy/check-destructive-migration.sh \
            "${{ steps.current.outputs.commit }}" "${{ github.sha }}"

      # 서버에 SSH 로 붙지 않고 SSM 으로 명령을 보냅니다.
      #
      # SSH 를 쓰려면 22 번을 GitHub 러너에게 열어야 하는데, 러너 주소는 고정되지
      # 않아 사실상 넓게 여는 것이 됩니다. 관리 경로를 좁혀 둔 의미가 없어집니다.
      # SSM 은 인바운드 포트를 열지 않고, 저장소에 개인 키를 두지 않아도 됩니다.
      - name: Send command to instance
        id: ssm
        env:
          INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          FRONTEND_IMAGE: ${{ inputs.frontend_image }}
          ALLOW_DESTRUCTIVE: ${{ inputs.allow_destructive_migration }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          set -euo pipefail

          [[ -n "$INSTANCE_ID" ]] || { echo "DEPLOY_INSTANCE_ID 변수가 없습니다."; exit 1; }

          # 서버에 있는 사본이 아니라 이번 commit 의 스크립트를 보냅니다. 서버 사본은
          # 언제 갱신됐는지 알 수 없어, 배포되는 코드와 배포하는 절차가 어긋납니다.
          script_b64="$(base64 -w0 deploy/deploy.sh)"

          args="--environment $(printf '%q' "$TARGET_ENVIRONMENT")"
          args+=" --backend-image $(printf '%q' "$BACKEND_IMAGE") --commit $(printf '%q' "$GITHUB_SHA")"
          if [[ -n "$FRONTEND_IMAGE" ]]; then
            args+=" --frontend-image $(printf '%q' "$FRONTEND_IMAGE")"
          fi

          # 배포 스크립트는 deploy 사용자로 돌립니다. SSM 은 root 로 실행하는데,
          # 그대로 두면 sed -i 가 만드는 새 파일이 root 소유가 되어 다음 배포에서
          # deploy 가 환경 파일을 고치지 못합니다.
          jq -n --arg s "$script_b64" --arg a "$args" '{
            commands: [
              "set -eu",
              ("echo " + $s + " | base64 -d > /srv/mopl/app/deploy/deploy.sh"),
              "chown deploy:deploy /srv/mopl/app/deploy/deploy.sh",
              "chmod 0755 /srv/mopl/app/deploy/deploy.sh",
              ("runuser -u deploy -- bash /srv/mopl/app/deploy/deploy.sh " + $a)
            ]
          }' > /tmp/params.json

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 900 \
            --parameters file:///tmp/params.json \
            --query 'Command.CommandId' --output text)"

          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "SSM command: $command_id"

      - name: Wait for command to finish
        env:
          INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          set -euo pipefail

          # 배포는 백엔드 두 인스턴스가 health 를 통과할 때까지 기다리므로 몇 분
          # 걸립니다. InProgress 가 아니게 될 때까지만 봅니다.
          for _ in $(seq 1 120); do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          echo "상태: $status"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text

          err="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text)"
          [[ -n "$err" ]] && printf '%s\n' "$err" >&2

          [[ "$status" == "Success" ]]

      # deploy.sh 가 서버 내부 health 를 확인한 뒤, 실제 사용자가 지나는 HTTPS, Caddy,
      # gateway, backend 경로도 확인합니다. readiness 는 인증이 필요하므로 공개 계약인
      # CSRF 발급(204)을 사용해 백엔드까지 도달했는지 봅니다.
      - name: Verify public endpoints
        env:
          MOPL_DOMAIN: ${{ vars.MOPL_DOMAIN }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          set -euo pipefail

          [[ -n "$MOPL_DOMAIN" ]] || { echo "MOPL_DOMAIN 변수가 없습니다."; exit 1; }

          for attempt in $(seq 1 30); do
            home_status="$(curl --silent --show-error --output /tmp/mopl-home.html \
              --write-out '%{http_code}' --max-time 10 \
              "https://$MOPL_DOMAIN/" || true)"
            csrf_status="$(curl --silent --show-error --output /tmp/mopl-csrf.txt \
              --write-out '%{http_code}' --max-time 10 \
              "https://$MOPL_DOMAIN/api/auth/csrf-token" || true)"

            if [[ "$home_status" == "200" && "$csrf_status" == "204" ]]; then
              echo "$TARGET_ENVIRONMENT 공개 경로 검증 성공: home=$home_status csrf=$csrf_status"
              exit 0
            fi

            echo "$TARGET_ENVIRONMENT 공개 경로 대기 ($attempt/30): home=$home_status csrf=$csrf_status"
            sleep 5
          done

          echo "$TARGET_ENVIRONMENT 공개 경로가 준비되지 않았습니다."
          head -c 500 /tmp/mopl-home.html 2>/dev/null || true
          exit 1

      # 실패한 배포도 무엇을 시도했는지 남아야 합니다. 실행 로그를 뒤지지 않고 찾을 수
      # 있어야 다음 판단이 빨라집니다.
      - name: Record deployment
        if: always()
        env:
          INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
        run: |
          set -euo pipefail

          state=""
          if [[ -n "$INSTANCE_ID" ]]; then
            cid="$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters 'commands=["cat /etc/mopl/deploy-state.env 2>/dev/null || true"]' \
              --query 'Command.CommandId' --output text)"
            sleep 5
            state="$(aws ssm get-command-invocation --command-id "$cid" \
              --instance-id "$INSTANCE_ID" --query StandardOutputContent \
              --output text 2>/dev/null || true)"
          fi

          {
            echo "### 배포 결과"
            echo
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 환경 | \`${{ inputs.target_environment }}\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| 백엔드 이미지 | \`${{ inputs.backend_image }}\` |"
            echo "| 프론트 이미지 | \`${{ inputs.frontend_image || '(변경 없음)' }}\` |"
            echo "| 결과 | \`${{ job.status }}\` |"
            echo
            if [[ -n "$state" ]]; then
              echo '```'
              printf '%s\n' "$state"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
