name: Deploy

# 자동으로 돌지 않습니다. 배포 시점은 사람이 정합니다. main push 마다 운영에 나가면
# 되돌릴 판단을 할 사람이 없는 시간에도 배포가 일어납니다.
on:
  workflow_dispatch:
    inputs:
      backend_image:
        description: '배포할 백엔드 이미지. digest(@sha256:...) 또는 commit SHA 태그'
        required: true
        type: string
      frontend_image:
        description: '배포할 프론트엔드 이미지. 비우면 지금 것을 그대로 둡니다'
        required: false
        type: string
      allow_destructive_migration:
        description: '역호환되지 않는 마이그레이션을 알고도 진행합니다'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# 같은 환경에 배포가 겹치면 두 스크립트가 같은 env 파일과 같은 컨테이너를 동시에
# 건드립니다. 어느 이미지가 남는지도 정해지지 않습니다. 진행 중인 것을 취소하지 않고
# 기다립니다 - 배포 도중 취소는 절반만 교체된 상태를 남깁니다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # OIDC 로 IAM 역할을 맡습니다. 장기 자격 증명을 저장소에 두지 않습니다.
      id-token: write
    # 보호된 environment 입니다. 승인자와 대상 브랜치 제한은 저장소 설정에 있습니다.
    environment:
      name: production
      url: https://${{ vars.MOPL_DOMAIN }}

    steps:
      # 마이그레이션 비교에 이력이 필요합니다. 얕은 clone 이면 이전 배포 commit 을
      # 찾지 못하고, 그러면 확인 절차가 통과가 아니라 실패로 끝납니다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve currently deployed commit
        id: current
        env:
          INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
        run: |
          set -euo pipefail

          cid="$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["sed -n \"s/^DEPLOY_COMMIT=//p\" /etc/mopl/deploy-state.env 2>/dev/null || true"]' \
            --query 'Command.CommandId' --output text)"
          sleep 5

          deployed="$(aws ssm get-command-invocation --command-id "$cid" \
            --instance-id "$INSTANCE_ID" --query StandardOutputContent \
            --output text 2>/dev/null | tr -d '[:space:]')"

          echo "commit=$deployed" >> "$GITHUB_OUTPUT"
          echo "직전 배포 commit: ${deployed:-(없음)}"

      # 이미지 rollback 은 스키마를 되돌리지 않습니다. 되돌려도 고장난 채로 남는
      # 변경이 섞여 있으면 배포 전에 막습니다.
      #
      # 첫 배포는 비교할 대상이 없어 건너뜁니다. 그때는 빈 스키마이므로 되돌릴
      # 이전 상태 자체가 없습니다.
      - name: Check migration compatibility
        if: ${{ steps.current.outputs.commit != '' }}
        env:
          ALLOW_DESTRUCTIVE_MIGRATION: ${{ inputs.allow_destructive_migration }}
        run: |
          bash deploy/check-destructive-migration.sh \
            "${{ steps.current.outputs.commit }}" "${{ github.sha }}"

      # 서버에 SSH 로 붙지 않고 SSM 으로 명령을 보냅니다.
      #
      # SSH 를 쓰려면 22 번을 GitHub 러너에게 열어야 하는데, 러너 주소는 고정되지
      # 않아 사실상 넓게 여는 것이 됩니다. 관리 경로를 좁혀 둔 의미가 없어집니다.
      # SSM 은 인바운드 포트를 열지 않고, 저장소에 개인 키를 두지 않아도 됩니다.
      - name: Send command to instance
        id: ssm
        env:
          INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          FRONTEND_IMAGE: ${{ inputs.frontend_image }}
          ALLOW_DESTRUCTIVE: ${{ inputs.allow_destructive_migration }}
        run: |
          set -euo pipefail

          [[ -n "$INSTANCE_ID" ]] || { echo "DEPLOY_INSTANCE_ID 변수가 없습니다."; exit 1; }

          # 서버에 있는 사본이 아니라 이번 commit 의 스크립트를 보냅니다. 서버 사본은
          # 언제 갱신됐는지 알 수 없어, 배포되는 코드와 배포하는 절차가 어긋납니다.
          script_b64="$(base64 -w0 deploy/deploy.sh)"

          args="--backend-image $(printf '%q' "$BACKEND_IMAGE") --commit $(printf '%q' "$GITHUB_SHA")"
          if [[ -n "$FRONTEND_IMAGE" ]]; then
            args+=" --frontend-image $(printf '%q' "$FRONTEND_IMAGE")"
          fi

          # 배포 스크립트는 deploy 사용자로 돌립니다. SSM 은 root 로 실행하는데,
          # 그대로 두면 sed -i 가 만드는 새 파일이 root 소유가 되어 다음 배포에서
          # deploy 가 환경 파일을 고치지 못합니다.
          jq -n --arg s "$script_b64" --arg a "$args" '{
            commands: [
              "set -euo pipefail",
              ("echo " + $s + " | base64 -d > /srv/mopl/app/deploy/deploy.sh"),
              "chown deploy:deploy /srv/mopl/app/deploy/deploy.sh",
              "chmod 0755 /srv/mopl/app/deploy/deploy.sh",
              ("runuser -u deploy -- bash /srv/mopl/app/deploy/deploy.sh " + $a)
            ]
          }' > /tmp/params.json

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 900 \
            --parameters file:///tmp/params.json \
            --query 'Command.CommandId' --output text)"

          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "SSM command: $command_id"

      - name: Wait for command to finish
        env:
          INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          set -euo pipefail

          # 배포는 백엔드 두 인스턴스가 health 를 통과할 때까지 기다리므로 몇 분
          # 걸립니다. InProgress 가 아니게 될 때까지만 봅니다.
          for _ in $(seq 1 120); do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          echo "상태: $status"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text

          err="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text)"
          [[ -n "$err" ]] && printf '%s\n' "$err" >&2

          [[ "$status" == "Success" ]]

      # 실패한 배포도 무엇을 시도했는지 남아야 합니다. 실행 로그를 뒤지지 않고 찾을 수
      # 있어야 다음 판단이 빨라집니다.
      - name: Record deployment
        if: always()
        env:
          INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
        run: |
          set -euo pipefail

          state=""
          if [[ -n "$INSTANCE_ID" ]]; then
            cid="$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters 'commands=["cat /etc/mopl/deploy-state.env 2>/dev/null || true"]' \
              --query 'Command.CommandId' --output text)"
            sleep 5
            state="$(aws ssm get-command-invocation --command-id "$cid" \
              --instance-id "$INSTANCE_ID" --query StandardOutputContent \
              --output text 2>/dev/null || true)"
          fi

          {
            echo "### 배포 결과"
            echo
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| 백엔드 이미지 | \`${{ inputs.backend_image }}\` |"
            echo "| 프론트 이미지 | \`${{ inputs.frontend_image || '(변경 없음)' }}\` |"
            echo "| 결과 | \`${{ job.status }}\` |"
            echo
            if [[ -n "$state" ]]; then
              echo '```'
              printf '%s\n' "$state"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
