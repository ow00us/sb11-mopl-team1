    LocalCredentialEmailVerificationRequest:
      type: "object"
      properties:
        email:
          type: "string"
          format: "email"
          maxLength: 100
          description: "로컬 로그인 ID로 등록할 실제 이메일"
          example: "user@example.com"
      required:
        - "email"
    LocalCredentialRegistrationRequest:
      type: "object"
      properties:
        email:
          type: "string"
          format: "email"
          maxLength: 100
          description: "인증 코드를 발급받은 실제 이메일"
          example: "user@example.com"
        verificationCode:
          type: "string"
          pattern: '^\d{6}$'
          description: "이메일로 전달받은 6자리 인증 코드"
          example: "123456"
        password:
          type: "string"
          minLength: 8
          maxLength: 72
          pattern: '^(?=.*[A-Za-z])(?=.*\d)(?=.*[!@#$%^&*()_+\-={}\[\]|:;"''<>,.?/~`])[A-Za-z\d!@#$%^&*()_+\-={}\[\]|:;"''<>,.?/~`]+$'
          description: "ASCII 영문, 숫자, 특수문자를 각각 하나 이상 포함하는 새 비밀번호"
      required:
        - "email"
        - "verificationCode"
        - "password"
    ChangePasswordRequest:
      type: "object"
      properties:
        password:
          type: "string"
          description: "8~72자의 새 비밀번호입니다. ASCII 영문, 숫자, 특수문자를 각각 하나 이상 포함해야 합니다."
          minLength: 8
          maxLength: 72
          pattern: '^(?=.*[A-Za-z])(?=.*\d)(?=.*[!@#$%^&*()_+\-={}\[\]|:;"''<>,.?/~`])[A-Za-z\d!@#$%^&*()_+\-={}\[\]|:;"''<>,.?/~`]+$'
