              schema:
                "$ref": "#/components/schemas/ErrorResponse"
components:
  schemas:
    UserCreateRequest:
      type: "object"
      properties:
        name:
          type: "string"
          description: "이름"
        email:
          type: "string"
          description: "이메일"
        password:
          type: "string"
          description: "비밀번호"
      required:
        - "email"
        - "name"
        - "password"
    ErrorResponse:
      type: "object"
      properties:
        exceptionName:
          type: "string"
          description: "예외 이름"
        message:
          type: "string"
          description: "오류 메시지"
        details:
          type: "object"
          additionalProperties:
            type: "string"
          description: "오류 부가 정보"
        errorCode:
          type: "string"
          description: "애플리케이션 오류 코드"
          example: "COMMON_400_1"
      required:
        - "exceptionName"
        - "errorCode"
        - "message"
        - "details"
    UserDto:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "사용자 ID"
        createdAt:
          type: "string"
          format: "date-time"
          description: "사용자 생성 시간"
        email:
          type: "string"
          description: "이메일"
        name:
          type: "string"
          description: "사용자 이름"
        profileImageUrl:
          type: "string"
          description: "프로필 이미지 URL"
        role:
          type: "string"
          description: "사용자 역할"
          enum:
            - "USER"
            - "ADMIN"
        locked:
          type: "boolean"
      required:
        - "createdAt"
        - "email"
        - "id"
        - "locked"
        - "name"
        - "role"
    ReviewCreateRequest:
      type: "object"
      properties:
        contentId:
          type: "string"
          format: "uuid"
          description: "콘텐츠 ID"
        text:
          type: "string"
          description: "리뷰 내용"
        rating:
          type: "number"
          format: "double"
          description: "평점 (0.0 ~ 5.0)"
          minimum: 0
          maximum: 5
          multipleOf: 0.5
      required:
        - "contentId"
        - "rating"
        - "text"
    ReviewDto:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "리뷰 ID"
        contentId:
          type: "string"
          format: "uuid"
          description: "콘텐츠 ID"
        author:
          "$ref": "#/components/schemas/UserSummary"
          description: "작성자 정보"
        text:
          type: "string"
          description: "리뷰 내용"
        rating:
          type: "number"
          format: "double"
          description: "평점 (0.0 ~ 5.0)"
      required:
        - "author"
        - "contentId"
        - "id"
        - "rating"
        - "text"
    UserSummary:
      type: "object"
      description: |
        여러 도메인의 응답에서 공통으로 사용하는 사용자 요약.
        name / profileImageUrl 은 User 도메인 연동이 완료되기 전까지 null 로 반환될 수 있어
        OpenAPI 3.1 표준 nullable 표기(["string", "null"])를 사용한다.
      properties:
        userId:
          type: "string"
          format: "uuid"
          description: "사용자 ID"
        name:
          type:
            - "string"
            - "null"
          description: "사용자 이름 (User 도메인 연동 전까지 null 가능)"
        profileImageUrl:
          type:
            - "string"
            - "null"
          description: "사용자 프로필 이미지 URL (User 도메인 연동 전까지 null 가능)"
      required:
        - "userId"
    PlaylistCreateRequest:
      type: "object"
      properties:
        title:
          type: "string"
          description: "플레이리스트 제목"
        description:
          type: "string"
          description: "플레이리스트 설명"
      required:
        - "description"
        - "title"
    ContentSummary:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "콘텐츠 ID"
        type:
          type: "string"
          description: "콘텐츠 타입"
          enum:
            - "movie"
            - "tvSeries"
            - "sport"
        title:
          type: "string"
          description: "콘텐츠 제목"
        description:
          type: "string"
          description: "콘텐츠 설명"
        thumbnailUrl:
          type: "string"
          description: "썸네일 이미지 URL"
        tags:
          type: "array"
          description: "콘텐츠 태그 목록"
          items:
            type: "string"
        averageRating:
          type: "number"
          format: "double"
          description: "평균 평점"
        reviewCount:
          type: "integer"
          format: "int32"
          description: "리뷰 개수"
      required:
        - "averageRating"
        - "id"
        - "reviewCount"
        - "tags"
        - "title"
        - "type"
    PlaylistDto:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "플레이리스트 ID"
        owner:
          "$ref": "#/components/schemas/UserSummary"
          description: "플레이리스트 소유자"
        title:
          type: "string"
          description: "플레이리스트 제목"
        description:
          type: "string"
          description: "플레이리스트 설명"
        updatedAt:
          type: "string"
          format: "date-time"
          description: "수정된 시간"
        subscriberCount:
          type: "integer"
          format: "int64"
          description: "구독자 수"
        subscribedByMe:
          type: "boolean"
          description: "구독 여부"
        contents:
          type: "array"
          description: "플레이리스트에 포함된 콘텐츠 목록"
          items:
            "$ref": "#/components/schemas/ContentSummary"
      required:
        - "contents"
        - "description"
        - "id"
        - "owner"
        - "subscribedByMe"
        - "subscriberCount"
        - "title"
        - "updatedAt"
    SubscriberItemDto:
      type: "object"
      description: "플레이리스트 구독자 목록의 아이템."
      properties:
        subscriptionId:
          type: "string"
          format: "uuid"
          description: "구독 관계 ID"
        user:
          "$ref": "#/components/schemas/UserSummary"
          description: "구독자 요약. name/profileImageUrl 은 User 도메인 연동 전까지 null."
        subscribedAt:
          type: "string"
          format: "date-time"
          description: "구독 생성 시각"
      required:
        - "subscriptionId"
        - "user"
        - "subscribedAt"
    FollowRequest:
      type: "object"
      properties:
        followeeId:
          type: "string"
          format: "uuid"
          description: "팔로우 대상 사용자 ID"
      required:
        - "followeeId"
    FollowDto:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "팔로우 ID"
        followeeId:
          type: "string"
          format: "uuid"
          description: "팔로우 대상 사용자 ID"
        followerId:
          type: "string"
          format: "uuid"
          description: "팔로워 사용자 ID"
      required:
        - "followeeId"
        - "followerId"
        - "id"
    FollowUserItemDto:
      type: "object"
      description: "팔로워/팔로잉 목록의 아이템. followers 응답에서 user 는 팔로워, followings 응답에서 user 는 팔로우 대상."
      properties:
        followId:
          type: "string"
          format: "uuid"
          description: "팔로우 관계 ID (unfollow 시 사용)"
        user:
          "$ref": "#/components/schemas/UserSummary"
          description: "상대 사용자 요약. name/profileImageUrl 은 User 도메인 연동 전까지 null."
        followedAt:
          type: "string"
          format: "date-time"
          description: "팔로우 관계 생성 시각"
      required:
        - "followId"
        - "user"
        - "followedAt"
    ConversationCreateRequest:
      type: "object"
      properties:
        withUserId:
          type: "string"
          format: "uuid"
          description: "대화 상대 정보 ID"
      required:
        - "withUserId"
    ConversationDto:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "대화 ID"
        with:
          "$ref": "#/components/schemas/UserSummary"
          description: "대화 상대 정보"
        hasUnread:
          type: "boolean"
          description: "읽지 않은 메시지 존재 여부"
        latestMessage:
          oneOf:
            -
              "$ref": "#/components/schemas/DirectMessageDto"
            -
              type: "null"
          description: "마지막 메시지 내용. 새 대화에는 null입니다."
      required:
        - "hasUnread"
        - "id"
        - "latestMessage"
        - "with"
    DirectMessageDto:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "메시지 ID"
        conversationId:
          type: "string"
          format: "uuid"
          description: "대화 ID"
        createdAt:
          type: "string"
          format: "date-time"
          description: "메시지 생성 시간"
        sender:
          "$ref": "#/components/schemas/UserSummary"
          description: "발신자 정보"
        receiver:
          "$ref": "#/components/schemas/UserSummary"
          description: "수신자 정보"
        content:
          type: "string"
          description: "메시지 내용"
      required:
        - "content"
        - "conversationId"
        - "createdAt"
        - "id"
        - "receiver"
        - "sender"
    ContentCreateRequest:
      type: "object"
      properties:
        type:
          type: "string"
          description: "콘텐츠 타입"
          enum:
            - "movie"
            - "tvSeries"
            - "sport"
        title:
          type: "string"
          description: "콘텐츠 제목"
        description:
          type: "string"
          description: "콘텐츠 설명"
        tags:
          type: "array"
          description: "콘텐츠 태그 목록"
          items:
            type: "string"
      required:
        - "description"
        - "tags"
        - "title"
        - "type"
    ContentDto:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "콘텐츠 ID"
        type:
          type: "string"
          description: "콘텐츠 타입"
          enum:
            - "movie"
            - "tvSeries"
            - "sport"
        title:
          type: "string"
          description: "콘텐츠 제목"
        description:
          type: "string"
          description: "콘텐츠 설명"
        thumbnailUrl:
          type: "string"
          description: "썸네일 이미지 URL"
        tags:
          type: "array"
          description: "콘텐츠 태그 목록"
          items:
            type: "string"
        averageRating:
          type: "number"
          format: "double"
          description: "평균 평점"
        reviewCount:
          type: "integer"
          format: "int32"
          description: "리뷰 개수"
        watcherCount:
          type: "integer"
          format: "int64"
          description: "시청자 수"
      required:
        - "averageRating"
        - "description"
        - "id"
        - "reviewCount"
