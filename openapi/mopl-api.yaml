  "/api/playlists/{playlistId}/subscribers":
    get:
      tags:
        - "플레이리스트 관리"
      summary: "플레이리스트 구독자 목록 조회 (커서 페이지네이션)"
      description: "특정 플레이리스트를 구독한 사용자들의 목록을 최근순(created_at DESC) 으로 반환합니다."
      operationId: "getPlaylistSubscribers"
      security:
        -
          BearerAuth: []
      parameters:
        -
          name: "playlistId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          name: "cursor"
          in: "query"
          description: "다음 페이지 커서 (마지막 subscribedAt 을 Base64 로 인코딩). idAfter 와 함께 제공해야 합니다."
          required: false
          schema:
            type: "string"
        -
          name: "idAfter"
          in: "query"
          description: "같은 subscribedAt 값 내 UUID 타이브레이커. cursor 와 함께 제공해야 합니다."
          required: false
          schema:
            type: "string"
            format: "uuid"
        -
          name: "limit"
          in: "query"
          required: true
          schema:
            type: "integer"
            format: "int32"
            minimum: 1
            maximum: 100
        -
          name: "sortBy"
          in: "query"
          required: false
          schema:
            type: "string"
            default: "subscribedAt"
            enum:
              - "subscribedAt"
        -
          name: "sortDirection"
          in: "query"
          required: false
          schema:
            type: "string"
            default: "DESCENDING"
            description: |
              현재 구독자 목록 조회는 최신순(DESCENDING)만 지원한다.
              오래된 순 요청(ASCENDING)은 400 을 반환한다.
            enum:
              - "DESCENDING"
      responses:
        "200":
          description: "성공"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/CursorResponseSubscriberItemDto"
        "400":
          description: "잘못된 요청 (파라미터 검증 실패, 잘못된 커서, cursor/idAfter 부정합)"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "401":
          description: "인증 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "404":
          description: "존재하지 않는 플레이리스트"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: "서버 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
