components:
  schemas:
    OutboxSkipRequest:
      type: "object"
      properties:
        reason:
          type: "string"
          description: "건너뛴 사유. 비워 둘 수 없습니다"
          maxLength: 1000
          minLength: 1
      required:
        - "reason"
    OutboxFailureDto:
      type: "object"
      description: "최종 실패한 Outbox 이벤트 한 건. 이벤트 payload는 담지 않습니다."
      properties:
        eventId:
          type: "string"
          format: "uuid"
          description: "envelope의 eventId"
        type:
          type: "string"
          description: "이벤트 타입"
        occurredAt:
          type: "string"
          format: "date-time"
          description: "도메인 사건이 일어난 시각"
        attempts:
          type: "integer"
          format: "int32"
          description: "최종 실패로 남기까지의 발행 시도 횟수"
        lastError:
          type: "string"
          description: "마지막 발행 실패 원인. 500자를 넘으면 뒤를 잘라 내려줍니다"
      required:
        - "eventId"
        - "type"
        - "occurredAt"
        - "attempts"
    OutboxFailureListResponse:
      type: "object"
      properties:
        totalCount:
          type: "integer"
          format: "int64"
          description: "최종 실패 상태인 전체 레코드 수"
        items:
          type: "array"
          description: "발생 시각이 이른 순으로 상한만큼 담은 목록"
          items:
            "$ref": "#/components/schemas/OutboxFailureDto"
      required:
        - "totalCount"
        - "items"
    UserCreateRequest:
      type: "object"
      properties:
        name:
          type: "string"
          description: "이름"
        email:
          type: "string"
          description: "이메일"
        password:
          type: "string"
          description: "비밀번호"
      required:
        - "email"
        - "name"
        - "password"
    ErrorResponse:
      type: "object"
      properties:
        exceptionName:
          type: "string"
          description: "예외 이름"
        message:
          type: "string"
          description: "오류 메시지"
        details:
          type: "object"
          additionalProperties:
            type: "string"
          description: "오류 부가 정보"
        errorCode:
          type: "string"
          description: "애플리케이션 오류 코드"
          example: "COMMON_400_1"
      required:
        - "exceptionName"
        - "errorCode"
        - "message"
        - "details"
    UserDto:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "사용자 ID"
        createdAt:
          type: "string"
          format: "date-time"
          description: "사용자 생성 시간"
        email:
          type:
            - "string"
            - "null"
          description: "사용자 이메일입니다. 이메일이 연결되지 않은 OAuth 사용자는 null입니다."
        name:
          type: "string"
          description: "사용자 이름"
        profileImageUrl:
          type: "string"
          description: "프로필 이미지 URL"
        role:
          type: "string"
          description: "사용자 역할"
          enum:
            - "USER"
            - "ADMIN"
        locked:
          type: "boolean"
      required:
        - "createdAt"
        - "email"
        - "id"
        - "locked"
        - "name"
        - "role"
    OAuthAccountDto:
      type: "object"
      description: "사용자에게 연결된 OAuth 계정의 공개 정보"
      properties:
        provider:
          type: "string"
          description: "OAuth 인증 제공자"
          enum:
            - "GOOGLE"
            - "KAKAO"
            - "NAVER"
        connectedAt:
          type: "string"
          format: "date-time"
          description: "OAuth 계정 연결 시각"
      required:
        - "provider"
        - "connectedAt"
    OAuthLinkStartResponse:
      type: "object"
      description: "OAuth 계정 연결을 시작할 서버 인증 경로"
      properties:
        authorizationPath:
          type: "string"
          description: "Spring Security OAuth2 Provider 인증 시작 경로"
          example: "/oauth2/authorization/google"
      required:
        - "authorizationPath"
    ReviewCreateRequest:
      type: "object"
      properties:
        contentId:
          type: "string"
          format: "uuid"
          description: "콘텐츠 ID"
        text:
          type: "string"
          description: "리뷰 내용"
        rating:
          type: "number"
          format: "double"
          description: "평점 (0.0 ~ 5.0)"
          minimum: 0
          maximum: 5
          multipleOf: 0.5
      required:
        - "contentId"
        - "rating"
        - "text"
    ReviewDto:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "리뷰 ID"
        contentId:
          type: "string"
          format: "uuid"
          description: "콘텐츠 ID"
        author:
          "$ref": "#/components/schemas/UserSummary"
          description: "작성자 정보"
        text:
          type: "string"
          description: "리뷰 내용"
        rating:
          type: "number"
          format: "double"
          description: "평점 (0.0 ~ 5.0)"
      required:
        - "author"
        - "contentId"
        - "id"
        - "rating"
        - "text"
    UserSummary:
      type: "object"
      description: |
        여러 도메인의 응답에서 공통으로 사용하는 사용자 요약.
        name / profileImageUrl 은 User 도메인 연동이 완료되기 전까지 null 로 반환될 수 있어
        OpenAPI 3.1 표준 nullable 표기(["string", "null"])를 사용한다.
      properties:
        userId:
          type: "string"
          format: "uuid"
          description: "사용자 ID"
        name:
          type:
            - "string"
            - "null"
          description: "사용자 이름 (User 도메인 연동 전까지 null 가능)"
        profileImageUrl:
          type:
            - "string"
            - "null"
          description: "사용자 프로필 이미지 URL (User 도메인 연동 전까지 null 가능)"
      required:
        - "userId"
    PlaylistCreateRequest:
      type: "object"
      properties:
        title:
          type: "string"
          description: "플레이리스트 제목"
        description:
          type: "string"
          description: "플레이리스트 설명"
      required:
        - "description"
        - "title"
    ContentSummary:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "콘텐츠 ID"
        type:
          type: "string"
          description: "콘텐츠 타입"
          enum:
            - "movie"
            - "tvSeries"
            - "sport"
        title:
          type: "string"
          description: "콘텐츠 제목"
        description:
          type: "string"
          description: "콘텐츠 설명"
        thumbnailUrl:
          type: "string"
          description: "썸네일 이미지 URL"
        tags:
          type: "array"
          description: "콘텐츠 태그 목록"
          items:
            type: "string"
        averageRating:
          type: "number"
          format: "double"
          description: "평균 평점"
        reviewCount:
          type: "integer"
          format: "int32"
          description: "리뷰 개수"
      required:
        - "averageRating"
        - "id"
        - "reviewCount"
        - "tags"
        - "title"
        - "type"
    PlaylistDto:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "플레이리스트 ID"
        owner:
          "$ref": "#/components/schemas/UserSummary"
          description: "플레이리스트 소유자"
        title:
          type: "string"
          description: "플레이리스트 제목"
        description:
          type: "string"
          description: "플레이리스트 설명"
        updatedAt:
          type: "string"
          format: "date-time"
          description: "수정된 시간"
        subscriberCount:
          type: "integer"
          format: "int64"
          description: "구독자 수"
        subscribedByMe:
          type: "boolean"
          description: "구독 여부"
        contents:
          type: "array"
          description: "플레이리스트에 포함된 콘텐츠 목록"
          items:
            "$ref": "#/components/schemas/ContentSummary"
      required:
        - "contents"
        - "description"
        - "id"
        - "owner"
        - "subscribedByMe"
        - "subscriberCount"
        - "title"
        - "updatedAt"
    SubscriberItemDto:
      type: "object"
