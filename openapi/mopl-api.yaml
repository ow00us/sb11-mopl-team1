      summary: "팔로우 추천 목록 조회 (친구의 친구 기반)"
      description: "요청자가 팔로우 중인 사용자들이 팔로우하는 대상을 후보로, 공통 팔로잉 수(commonFollowingCount) DESC → userId DESC 정렬로 반환합니다. 자기 자신과 이미 팔로우한 사용자는 제외합니다."
      operationId: "getFollowRecommendations"
      security:
        -
          BearerAuth: []
      parameters:
        -
          name: "cursor"
          in: "query"
          description: "다음 페이지 커서 (마지막 commonFollowingCount 를 Base64 로 인코딩). idAfter 와 함께 제공해야 합니다."
          required: false
          schema:
            type: "string"
        -
          name: "idAfter"
          in: "query"
          description: "같은 commonFollowingCount 값 내 userId 타이브레이커. cursor 와 함께 제공해야 합니다."
          required: false
          schema:
            type: "string"
            format: "uuid"
        -
          name: "limit"
          in: "query"
          required: true
          schema:
            type: "integer"
            format: "int32"
            minimum: 1
            maximum: 100
        -
          name: "sortBy"
          in: "query"
          required: false
          schema:
            type: "string"
            default: "commonFollowingCount"
            enum:
              - "commonFollowingCount"
        -
          name: "sortDirection"
          in: "query"
          required: false
          schema:
            type: "string"
            default: "DESCENDING"
            enum:
              - "DESCENDING"
      responses:
        "200":
          description: "성공"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/CursorResponseFollowRecommendationItemDto"
        "400":
          description: "잘못된 요청 (파라미터 검증 실패, 잘못된 커서, cursor/idAfter 부정합)"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "401":
          description: "인증 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: "서버 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
