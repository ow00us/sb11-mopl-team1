openapi: "3.1.0"
info:
  title: "모두의 플리 (Mopl) API"
  description: "프로토타입 OpenAPI를 기준으로 팀이 합의한 요청·응답 규칙을 반영한 API 계약입니다."
  version: "1.0"
servers:
  -
    url: "/"
    description: "현재 서버"
  -
    url: "http://localhost:8080"
    description: "로컬 서버"
security:
  -
    BearerAuth: []
tags:
  -
    name: "알림"
    description: "알림 API"
paths:
  "/api/admin/outbox/failures":
    get:
      tags:
        - "운영"
      summary: "[어드민] 최종 실패 Outbox 이벤트 목록 조회"
      description: "자동 재시도를 소진해 최종 실패로 남은 이벤트를 발생 시각이 이른 순으로 조회합니다. 이벤트 payload는 내려주지 않습니다."
      operationId: "findOutboxFailures"
      parameters:
        -
          name: "limit"
          in: "query"
          description: "조회 상한"
          required: false
          schema:
            type: "integer"
            format: "int32"
            description: "조회 상한"
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: "최종 실패 이벤트 목록"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/OutboxFailureListResponse"
        "400":
          description: "조회 상한이 허용 범위를 벗어남"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "401":
          description: "인증 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "403":
          description: "관리자 권한 없음"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: "서버 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/admin/outbox/failures/{eventId}/requeue":
    post:
      tags:
        - "운영"
      summary: "[어드민] 최종 실패 Outbox 이벤트 재처리"
      description: "최종 실패 이벤트 한 건을 다시 발행 대기로 되돌립니다. 새 레코드를 만들지 않고 기존 행의 상태만 바꾸므로 eventId, 파티션 키, 중복 제거 키가 그대로 유지됩니다."
      operationId: "requeueOutboxFailure"
      security:
        -
          BearerAuth: []
          CsrfToken: []
      parameters:
        -
          name: "eventId"
          in: "path"
          description: "재처리할 이벤트의 eventId"
          required: true
          schema:
            type: "string"
            format: "uuid"
            description: "재처리할 이벤트의 eventId"
      responses:
        "204":
          description: "발행 대기로 되돌림"
        "401":
          description: "인증 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "403":
          description: "관리자 권한 없음"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "404":
          description: "해당 eventId의 이벤트가 없음"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "409":
          description: "최종 실패 상태가 아니어서 되돌릴 수 없음"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: "서버 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/admin/outbox/failures/{eventId}/skip":
    post:
      tags:
        - "운영"
      summary: "[어드민] 최종 실패 Outbox 이벤트 건너뛰기"
      description: "최종 실패 이벤트 한 건을 보내지 않기로 하고 종결합니다. 발행 성공으로 표시하거나 행을 지우지 않고, 처리자와 처리 시각, 사유를 함께 보존합니다. 같은 요청이 다시 들어와도 204이며 감사 정보는 처음 전환 때의 값을 유지합니다."
      operationId: "skipOutboxFailure"
      security:
        -
          BearerAuth: []
          CsrfToken: []
      parameters:
        -
          name: "eventId"
          in: "path"
          description: "건너뛸 이벤트의 eventId"
          required: true
          schema:
            type: "string"
            format: "uuid"
            description: "건너뛸 이벤트의 eventId"
      requestBody:
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/OutboxSkipRequest"
        required: true
      responses:
        "204":
          description: "건너뛰기로 종결"
        "400":
          description: "사유가 비어 있음"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "401":
          description: "인증 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "403":
          description: "관리자 권한 없음"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "404":
          description: "해당 eventId의 이벤트가 없음"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "409":
          description: "최종 실패 상태가 아니어서 건너뛸 수 없음"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: "서버 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/users":
    get:
      tags:
        - "사용자 관리"
      summary: "[어드민] 사용자 목록 조회 (커서 페이지네이션)"
      operationId: "findUsers"
      parameters:
        -
          name: "emailLike"
          in: "query"
          description: "이메일"
          required: false
          schema:
            type: "string"
            description: "이메일"
        -
          name: "roleEqual"
          in: "query"
          description: "권한"
          required: false
          schema:
            type: "string"
            description: "권한"
            enum:
              - "USER"
              - "ADMIN"
        -
          name: "locked"
          in: "query"
          description: "계정 잠금 상태"
          required: false
          schema:
            type: "boolean"
            description: "계정 잠금 상태"
        -
          name: "cursor"
          in: "query"
          description: "커서"
          required: false
          schema:
            type: "string"
            description: "커서"
        -
          name: "idAfter"
          in: "query"
          description: "보조 커서"
          required: false
          schema:
            type: "string"
            format: "uuid"
            description: "보조 커서"
        -
          name: "limit"
          in: "query"
          description: "한 번에 가져올 개수"
          required: true
          schema:
            type: "integer"
            format: "int32"
            minimum: 1
            maximum: 100
            description: "한 번에 가져올 개수"
        -
          name: "sortDirection"
          in: "query"
          description: "정렬 방향"
          required: true
          schema:
            type: "string"
            description: "정렬 방향"
            enum:
              - "ASCENDING"
              - "DESCENDING"
        -
          name: "sortBy"
          in: "query"
          description: "정렬 기준"
          required: true
          schema:
            type: "string"
            description: "정렬 기준"
            enum:
              - "name"
              - "email"
              - "createdAt"
              - "locked"
              - "role"
      responses:
        "200":
          description: "성공"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/CursorResponseUserDto"
        "400":
          description: "잘못된 요청"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "401":
          description: "인증 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "403":
          description: "권한 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: "서버 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    post:
      tags:
        - "사용자 관리"
      summary: "사용자 등록 (회원가입)"
      operationId: "createUser"
      security:
        -
          CsrfToken: []
      requestBody:
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/UserCreateRequest"
        required: true
      responses:
        "201":
          description: "새 사용자 생성"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/UserDto"
        "400":
          description: "잘못된 요청"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "409":
          description: "이미 사용 중인 이메일"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: "서버 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/reviews":
    get:
      tags:
        - "리뷰 관리"
      summary: "리뷰 목록 조회 (커서 페이지네이션)"
      operationId: "findReviews"
      parameters:
        -
          name: "contentId"
          in: "query"
          description: "콘텐츠 ID"
          required: false
          schema:
            type: "string"
            format: "uuid"
            description: "콘텐츠 ID"
        -
          name: "cursor"
          in: "query"
          description: "커서"
          required: false
          schema:
            type: "string"
            description: "커서"
        -
          name: "idAfter"
          in: "query"
          description: "보조 커서"
          required: false
          schema:
            type: "string"
            format: "uuid"
            description: "보조 커서"
        -
          name: "limit"
          in: "query"
          description: "한 번에 가져올 개수"
          required: true
          schema:
            type: "integer"
            format: "int32"
            minimum: 1
            maximum: 100
            description: "한 번에 가져올 개수"
        -
          name: "sortDirection"
          in: "query"
          description: "정렬 방향"
          required: true
          schema:
            type: "string"
            description: "정렬 방향"
            enum:
              - "ASCENDING"
              - "DESCENDING"
        -
          name: "sortBy"
          in: "query"
          description: "정렬 기준"
          required: true
          schema:
            type: "string"
            description: "정렬 기준"
            enum:
              - "createdAt"
              - "rating"
      responses:
        "200":
          description: "성공"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/CursorResponseReviewDto"
        "400":
          description: "잘못된 요청"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "401":
          description: "인증 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: "서버 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    post:
      tags:
        - "리뷰 관리"
      summary: "리뷰 생성"
      description: "생성한 리뷰는 API 요청자 본인의 리뷰로 생성됩니다."
      operationId: "createReview"
      security:
        -
          BearerAuth: []
          CsrfToken: []
      requestBody:
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ReviewCreateRequest"
        required: true
      responses:
        "201":
          description: "새 리뷰 생성"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ReviewDto"
        "400":
          description: "잘못된 요청"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "401":
          description: "인증 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "409":
          description: "동일한 콘텐츠에 작성한 리뷰가 이미 존재함"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: "서버 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/playlists":
    get:
      tags:
        - "플레이리스트 관리"
      summary: "플레이리스트 목록 조회 (커서 페이지네이션)"
      operationId: "findPlaylists"
      parameters:
        -
          name: "keywordLike"
          in: "query"
          description: "검색 키워드"
          required: false
          schema:
            type: "string"
            description: "검색 키워드"
        -
          name: "ownerIdEqual"
          in: "query"
          description: "소유자 ID"
          required: false
          schema:
            type: "string"
            format: "uuid"
            description: "소유자 ID"
        -
          name: "subscriberIdEqual"
          in: "query"
          description: "구독자 ID"
          required: false
          schema:
            type: "string"
            format: "uuid"
            description: "구독자 ID"
        -
          name: "cursor"
          in: "query"
          description: "커서"
          required: false
          schema:
            type: "string"
            description: "커서"
        -
          name: "idAfter"
          in: "query"
          description: "보조 커서"
          required: false
          schema:
            type: "string"
            format: "uuid"
            description: "보조 커서"
        -
          name: "limit"
          in: "query"
          description: "한 번에 가져올 개수"
          required: true
          schema:
            type: "integer"
            format: "int32"
            minimum: 1
            maximum: 100
            description: "한 번에 가져올 개수"
        -
          name: "sortDirection"
          in: "query"
          description: "정렬 방향"
          required: true
          schema:
            type: "string"
            description: "정렬 방향"
            enum:
              - "ASCENDING"
              - "DESCENDING"
        -
          name: "sortBy"
          in: "query"
          description: |
            정렬 기준. `subscriberCount` 는 인기 랭킹 전용 엔드포인트 `GET /api/playlists/popular` 로 이관 예정입니다. FE 이관이 완료되면 이 옵션은 제거됩니다.
          required: true
          schema:
            type: "string"
            description: "정렬 기준"
            enum:
              - "updatedAt"
              - "subscriberCount"
      responses:
        "200":
          description: "성공"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/CursorResponsePlaylistDto"
        "400":
          description: "잘못된 요청"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "401":
          description: "인증 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: "서버 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    post:
      tags:
        - "플레이리스트 관리"
      summary: "플레이리스트 생성"
      description: "생성한 플레이리스트는 API 요청자 본인의 플레이리스트로 생성됩니다."
      operationId: "createPlaylist"
      security:
        -
          BearerAuth: []
          CsrfToken: []
      requestBody:
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PlaylistCreateRequest"
        required: true
      responses:
        "201":
          description: "성공"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/PlaylistDto"
        "400":
          description: "잘못된 요청"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "401":
          description: "인증 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: "서버 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/playlists/popular":
    get:
      tags:
        - "플레이리스트 관리"
      summary: "인기 플레이리스트 랭킹 조회 (커서 페이지네이션)"
      description: |
        구독자 수 기준으로 정렬된 인기 플레이리스트 목록을 커서 페이지네이션으로 조회합니다.
        정렬은 `subscriber_count DESC → updated_at DESC → id DESC` 3단 tie-break 로 페이지 경계까지 안정적입니다.
        인증 없이도 조회할 수 있으며, 인증 상태로 요청하면 응답의 `subscribedByMe` 가 채워집니다.

        기존 `GET /api/playlists?sortBy=subscriberCount` 옵션은 하위 호환을 위해 유지되며, FE 이관 완료 후 별도 이슈로 제거를 검토합니다.
      operationId: "findPopularPlaylists"
      parameters:
        -
          name: "cursor"
          in: "query"
          description: "커서 (subscriber_count 와 updated_at 을 인코딩한 값). idAfter 와 짝으로만 유효합니다."
          required: false
          schema:
            type: "string"
        -
          name: "idAfter"
          in: "query"
          description: "보조 커서 (마지막 항목의 id). cursor 와 짝으로만 유효합니다."
          required: false
          schema:
            type: "string"
            format: "uuid"
        -
          name: "limit"
          in: "query"
          description: "한 번에 가져올 개수 (1~100)"
          required: true
          schema:
            type: "integer"
            format: "int32"
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: "성공"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/CursorResponsePlaylistDto"
        "400":
          description: "잘못된 요청 (limit 범위 밖 · cursor·idAfter 짝 불일치 · 잘못된 커서 형식)"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: "서버 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/playlists/{playlistId}/subscription":
    post:
      tags:
        - "플레이리스트 관리"
      summary: "플레이리스트 구독"
      operationId: "subscribePlaylist"
      security:
        -
          BearerAuth: []
          CsrfToken: []
      parameters:
        -
          name: "playlistId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "204":
          description: "구독 완료. 이미 구독 중이어도 성공"
        "400":
          description: "잘못된 요청"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "401":
          description: "인증 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: "서버 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - "플레이리스트 관리"
      summary: "플레이리스트 구독 취소"
      operationId: "unsubscribePlaylist"
      security:
        -
          BearerAuth: []
          CsrfToken: []
      parameters:
        -
          name: "playlistId"
          in: "path"
          required: true
