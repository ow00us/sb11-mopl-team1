      summary: "특정 유저의 팔로워 목록 조회 (커서 페이지네이션)"
      description: "지정한 followeeId 를 팔로우한 사용자들의 목록을 최근순(created_at DESC)으로 반환합니다."
      operationId: "getFollowers"
      security:
        -
          BearerAuth: []
      parameters:
        -
          name: "followeeId"
          in: "query"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          name: "cursor"
          in: "query"
          description: "다음 페이지 커서 (마지막 followedAt 을 Base64 로 인코딩). idAfter 와 함께 제공해야 합니다."
          required: false
          schema:
            type: "string"
        -
          name: "idAfter"
          in: "query"
          description: "같은 followedAt 값 내 UUID 타이브레이커. cursor 와 함께 제공해야 합니다."
          required: false
          schema:
            type: "string"
            format: "uuid"
        -
          name: "limit"
          in: "query"
          required: true
          schema:
            type: "integer"
            format: "int32"
            minimum: 1
            maximum: 100
        -
          name: "sortBy"
          in: "query"
          required: false
          schema:
            type: "string"
            default: "followedAt"
            enum:
              - "followedAt"
        -
          name: "sortDirection"
          in: "query"
          required: false
          schema:
            type: "string"
            default: "DESCENDING"
            description: |
              현재 팔로우 목록 조회는 최신순(DESCENDING)만 지원한다.
              오래된 순 요청(ASCENDING)은 400 을 반환한다.
            enum:
