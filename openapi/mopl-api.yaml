  "/api/users/{userId}/oauth-accounts/{provider}/link":
    post:
      tags:
        - "사용자 관리"
      summary: "OAuth 계정 연결 인증 시작"
      description: >-
        현재 사용자 본인에게 OAuth Provider 계정을 연결하기 위한 인증 절차를 시작합니다.
        연결 의도는 HTTP Session에 저장되므로 클라이언트는 Cookie credentials를 포함해 이 API를 호출하고,
        응답으로 받은 authorizationPath로 이동할 때도 동일한 세션 쿠키를 유지해야 합니다.
        세션 쿠키가 유지되지 않으면 OAuth callback이 계정 연결이 아닌 일반 로그인 흐름으로 처리될 수 있습니다.
        authorizationPath는 백엔드 Origin을 기준으로 이동해야 하는 상대 경로입니다.
      operationId: "startOAuthAccountLink"
      security:
        - BearerAuth: [ ]
          CsrfToken: [ ]
      parameters:
        - name: "userId"
          in: "path"
          description: "OAuth 계정을 연결할 사용자 ID"
          required: true
          schema:
            type: "string"
            format: "uuid"
        - name: "provider"
          in: "path"
          description: "연결할 OAuth Provider"
          required: true
          schema:
            type: "string"
            enum:
              - "GOOGLE"
              - "KAKAO"
              - "NAVER"
      responses:
        "200":
          description: "OAuth 계정 연결 인증 시작 성공"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/OAuthLinkStartResponse"
        "400":
          description: "잘못된 사용자 ID 또는 OAuth Provider"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "401":
          description: "인증 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "403":
          description: "다른 사용자에게 OAuth 계정을 연결할 권한 없음"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "404":
          description: "사용자를 찾을 수 없음"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "409":
          description: "해당 Provider 계정이 이미 연결됨"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: "서버 오류"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
